# Cloud overlay: the same three services, reachable only through Caddy (HTTPS + login).
#   docker compose -f docker-compose.yml -f deploy/compose.prod.yml up -d --build

services:
  # Public demo, no login: each service caps its own recorded AI spend (US dollars) and
  # rate-limits each visitor. Together they match the usage bar's SITE_BUDGET_USD.
  knowledge-brain:
    ports: !reset []
    environment:
      KB_BUDGET_USD: ${KB_BUDGET_USD:-3}
  inbox-agent:
    ports: !reset []
    environment:
      INBOX_BUDGET_USD: ${INBOX_BUDGET_USD:-3}
  scope-builder:
    ports: !reset []
    environment:
      SCOPE_BUDGET_USD: ${SCOPE_BUDGET_USD:-4}

  caddy:
    image: caddy:2.8.4-alpine
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env, e.g. 3-110-25-7.sslip.io}
      KB_API_KEY: ${KB_API_KEY:-change-me}
      # Claude budget shown in the usage bar at the bottom of every page (US dollars).
      SITE_BUDGET_USD: ${SITE_BUDGET_USD:-10}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/auth.caddy:/etc/caddy/auth.caddy:ro
      - ./deploy/site:/srv/site:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - knowledge-brain
      - inbox-agent
      - scope-builder
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
