// Runs in <head> before the page draws, so a chosen theme never flashes the wrong colours.
// With no saved choice the page follows the system setting, live.
(function () {
  let t = "";
  try { t = (document.cookie.match(/(?:^|; )theme=(light|dark)/) || [])[1] || localStorage.getItem("theme") || ""; } catch {}
  const mq = matchMedia("(prefers-color-scheme: dark)");
  document.documentElement.dataset.theme = t || (mq.matches ? "dark" : "light");
  if (!t) mq.addEventListener?.("change", (e) => {
    let saved = ""; try { saved = localStorage.getItem("theme") || ""; } catch {}
    if (!saved && !/(?:^|; )theme=/.test(document.cookie)) document.documentElement.dataset.theme = e.matches ? "dark" : "light";
  });
})();

<title>Inbox Agent</title>
<!-- suite:css -->
<style>
/* Shared look for the three services and the hub page. Edit here, then run
   python scripts/sync_suite.py   (copies this into each page between suite markers).

   Layout: a narrow agent rail on the left (a top bar on phones), the page fills the rest.
   Theme: suite-head.js always sets data-theme on <html> (saved choice, else the system). */
/* Palette: warm neutrals (cream #F4F3EE, white, stone #B1ADA1) with one blue accent
   (#3480eb), used by all three agents; they're told apart by their icons. */
:root {
  --bg: #f4f3ee; --panel: #ffffff; --panel-2: #eceae3; --sunken: #f9f8f5; --text: #1f1e1b; --muted: #6b675f; --faint: #b1ada1;
  --line: #e4e2da; --line-strong: #d4d1c7; --rail: #ebe9e2;
  --shadow: 0 1px 2px rgba(60, 50, 30, .05), 0 1px 1px rgba(60, 50, 30, .03);
  --shadow-lg: 0 24px 64px -12px rgba(60, 50, 30, .22), 0 0 0 1px rgba(60, 50, 30, .07);
  --ok-bg: #e5f2e7; --ok: #1f7a45; --warn-bg: #f7edd8; --warn: #8a5a0a;
  --info-bg: #e3edfc; --info: #2a63bf; --err-bg: #f8e5e1; --err: #b23a26;
  --brand: #3480eb; --kb: var(--brand); --inbox: var(--brand); --scope: var(--brand);
  --primary: #3480eb; --on-primary: #ffffff;
  --radius: 12px; --radius-sm: 8px;
  --font: "Inter", "Segoe UI Variable Text", "Segoe UI", ui-sans-serif, system-ui, -apple-system, Roboto, sans-serif;
  --mono: "JetBrains Mono", "Cascadia Code", "SF Mono", ui-monospace, Consolas, monospace;
  --rail-w: 72px; --top-h: 0px; --bottom-h: 0px;
  color-scheme: light;
}
/* Dark: the same warm hue taken down to charcoal, cream text, and the blue lifted a touch. */
:root[data-theme="dark"] {
  --bg: #262624; --panel: #30302e; --panel-2: #3a3936; --sunken: #2b2a28; --text: #f4f3ee; --muted: #b1ada1; --faint: #7d796f;
  --line: #3b3a37; --line-strong: #4a4945; --rail: #1f1e1d;
  --shadow: 0 0 0 1px rgba(255, 250, 240, .02);
  --shadow-lg: 0 24px 80px -8px rgba(0, 0, 0, .55), 0 0 0 1px rgba(255, 250, 240, .07);
  --ok-bg: #1f3326; --ok: #7fcf98; --warn-bg: #3a3020; --warn: #e5bd6e;
  --info-bg: #22324a; --info: #9cc1f7; --err-bg: #3d2522; --err: #f0998a;
  --brand: #4d8ff0; --kb: var(--brand); --inbox: var(--brand); --scope: var(--brand);
  --primary: #3480eb; --on-primary: #ffffff;
  color-scheme: dark;
}
:root { --accent: var(--brand); }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); padding-left: var(--rail-w);
       font: 14px/1.55 var(--font); font-feature-settings: "cv11", "ss01"; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid color-mix(in srgb, var(--accent) 70%, transparent); outline-offset: 2px; border-radius: 6px; }
::selection { background: color-mix(in srgb, var(--accent) 30%, transparent); }
* { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }

/* Agent rail: the same on every page */
.s-bar { position: fixed; z-index: 40; left: 0; top: 0; bottom: 0; width: var(--rail-w); background: var(--rail);
         border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; padding: 12px 0; gap: 6px; }
.s-brand { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; text-decoration: none; margin-bottom: 8px; }
.s-brand:hover { background: var(--panel-2); }
.s-brand-name { display: none; }
.s-apps { display: flex; flex-direction: column; gap: 4px; width: 100%; padding: 0 8px; }
.s-app { position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0 6px; border-radius: 10px;
         color: var(--muted); text-decoration: none; font-size: 10.5px; font-weight: 550; letter-spacing: .01em; }
.s-app svg { width: 20px; height: 20px; }
.s-app:hover { color: var(--text); background: var(--panel-2); }
.s-app[aria-current="page"] { color: var(--text); background: var(--panel-2); box-shadow: inset 0 0 0 1px var(--line); }
.s-app[aria-current="page"]::before { content: ""; position: absolute; left: -8px; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; background: var(--c, var(--accent)); }
.s-app[data-suite-link="kb"] { --c: var(--kb); } .s-app[data-suite-link="inbox"] { --c: var(--inbox); } .s-app[data-suite-link="scope"] { --c: var(--scope); }
.s-app[aria-current="page"] svg { color: var(--c, var(--accent)); }
.s-live { position: absolute; top: 6px; right: 12px; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); box-shadow: 0 0 0 2px var(--rail); }
.s-live.up { background: var(--ok); } .s-live.down { background: var(--err); }
.s-right { margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 6px; }
#s-right:empty { display: none; }
.s-sep { width: 28px; height: 1px; background: var(--line); margin: 4px 0; }

/* App sub-header: title + sub-tabs (Inbox and Scope pages) */
.app-head { max-width: 1320px; margin: 0 auto; padding: 22px 24px 0; display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.app-title { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: -.02em; display: flex; align-items: center; gap: 10px; }
.app-title::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--accent); box-shadow: 0 0 12px color-mix(in srgb, var(--accent) 60%, transparent); }
.app-sub { color: var(--muted); margin: 4px 0 0; font-size: 13.5px; max-width: 760px; }
.app-head #s-right { margin-left: auto; align-self: center; }
.subtabs { display: flex; gap: 2px; margin-left: auto; background: var(--panel-2); padding: 3px; border-radius: 10px; border: 1px solid var(--line); }
.subtabs button { background: none; border: 0; padding: 5px 12px; border-radius: 7px; color: var(--muted); font: inherit; font-size: 13px; font-weight: 550; cursor: pointer; display: flex; gap: 6px; align-items: center; }
.subtabs button:hover { color: var(--text); }
.subtabs button[aria-selected="true"] { background: var(--panel); color: var(--text); box-shadow: var(--shadow), 0 0 0 1px var(--line); }
.wrap { max-width: 1320px; margin: 0 auto; padding: 16px 24px; }

/* Building blocks */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
.panel + .panel { margin-top: 16px; }
/* ...but not when panels sit side by side in a grid (that offset the hub cards and the inbox). */
.grid3 > .panel, .layout > .panel, .layout > * > .panel:first-child, .ask-grid > .panel { margin-top: 0; }
.panel.flush { padding: 0; }
h1, h2, h3 { letter-spacing: -.015em; }
h2 { font-size: 15.5px; font-weight: 650; margin: 0 0 4px; }
h3.label { font-size: 11px; margin: 20px 0 8px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 650; }
.muted, .meta { color: var(--muted); }
.meta { font-size: 12.5px; }
.sub { color: var(--muted); margin: 0 0 14px; font-size: 13.5px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
.spacer { flex: 1; }
code { font: .9em var(--mono); background: var(--panel-2); border: 1px solid var(--line); padding: 1px 5px; border-radius: 5px; }
input, textarea, select { width: 100%; font: inherit; color: var(--text); background: var(--sunken); border: 1px solid var(--line-strong);
                          border-radius: var(--radius-sm); padding: 8px 11px; transition: border-color .12s, box-shadow .12s; }
input::placeholder, textarea::placeholder { color: var(--faint); }
input:focus, textarea:focus, select:focus { outline: none; border-color: color-mix(in srgb, var(--accent) 65%, var(--line-strong)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent); }
textarea { resize: vertical; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; background: var(--primary); color: var(--on-primary); border: 1px solid transparent;
       border-radius: var(--radius-sm); padding: 7px 14px; font: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap;
       transition: background-color .12s ease, border-color .12s ease, opacity .12s ease; }
.btn:hover { opacity: .88; }
.btn.secondary { background: var(--panel); color: var(--text); border-color: var(--line-strong); box-shadow: var(--shadow); }
.btn.secondary:hover { background: var(--panel-2); opacity: 1; }
.btn.ghost { background: none; color: var(--muted); padding: 5px 10px; }
.btn.ghost:hover { color: var(--text); background: var(--panel-2); opacity: 1; }
.btn.small { padding: 4px 10px; font-size: 12.5px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600;
         background: var(--panel-2); color: var(--muted); white-space: nowrap; border: 1px solid var(--line); }
.badge.ok { background: var(--ok-bg); color: var(--ok); border-color: color-mix(in srgb, var(--ok) 22%, transparent); }
.badge.warn { background: var(--warn-bg); color: var(--warn); border-color: color-mix(in srgb, var(--warn) 22%, transparent); }
.badge.info { background: var(--info-bg); color: var(--info); border-color: color-mix(in srgb, var(--info) 22%, transparent); }
.badge.err { background: var(--err-bg); color: var(--err); border-color: color-mix(in srgb, var(--err) 22%, transparent); }
.badge.accent { background: color-mix(in srgb, var(--accent) 13%, transparent); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 25%, transparent); }
.chip { display: inline-flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; background: var(--panel);
        border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font: inherit; font-size: 13.5px; color: var(--text); cursor: pointer;
        transition: border-color .12s, background-color .12s; }
.chip small { color: var(--muted); font-size: 12px; }
.chip:hover { border-color: var(--line-strong); background: var(--panel-2); }
.banner { padding: 10px 14px; border-radius: 10px; margin-bottom: 12px; display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; border: 1px solid transparent; }
.banner.err { background: var(--err-bg); color: var(--err); border-color: color-mix(in srgb, var(--err) 20%, transparent); }
.banner.info { background: var(--info-bg); color: var(--info); border-color: color-mix(in srgb, var(--info) 20%, transparent); }
.banner.ok { background: var(--ok-bg); color: var(--ok); border-color: color-mix(in srgb, var(--ok) 20%, transparent); }
.banner.warn { background: var(--warn-bg); color: var(--warn); border-color: color-mix(in srgb, var(--warn) 20%, transparent); }
.empty { color: var(--muted); text-align: center; padding: 32px 20px; }
.steps { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; counter-reset: s; }
.steps li { display: grid; grid-template-columns: 24px 1fr; gap: 10px; align-items: start; counter-increment: s; }
.steps li::before { content: counter(s); width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; font: 600 12px var(--mono);
                    background: var(--panel-2); border: 1px solid var(--line); color: var(--muted); }
.kbd { font: 11px var(--mono); padding: 1px 5px; border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 5px; color: var(--muted); background: var(--panel); }
.spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--accent) 25%, transparent);
           border-top-color: var(--accent); animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; vertical-align: top; padding: 9px 10px; border-bottom: 1px solid var(--line); font-size: 13.5px; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 650; }
.table-wrap { overflow-x: auto; }
.md p { margin: 0 0 10px; } .md ol, .md ul { margin: 0 0 10px; padding-left: 22px; } .md li { margin: 4px 0; } .md li::marker { color: var(--muted); }
.lightbox { position: fixed; inset: 0; z-index: 90; background: rgba(5, 5, 7, .82); backdrop-filter: blur(4px); display: grid; place-items: center; padding: 24px; cursor: zoom-out; }
.lightbox img { max-width: 100%; max-height: 100%; border-radius: 10px; box-shadow: 0 10px 40px rgba(0, 0, 0, .5); background: #fff; }
.toast { position: fixed; bottom: calc(20px + var(--bottom-h)); left: calc(50% + var(--rail-w) / 2); transform: translateX(-50%); z-index: 95; background: var(--panel); color: var(--text);
         border: 1px solid var(--line-strong); padding: 9px 14px; border-radius: 10px; font-weight: 550; font-size: 13.5px; box-shadow: var(--shadow-lg); max-width: calc(100% - 32px); }

/* Icon buttons in the rail */
.s-icon { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; border: 1px solid transparent; background: none; color: var(--muted); cursor: pointer; position: relative; }
.s-icon:hover { color: var(--text); background: var(--panel-2); }
.s-icon[aria-expanded="true"] { color: var(--text); background: var(--panel-2); border-color: var(--line); }
.s-icon svg { width: 18px; height: 18px; }
.s-icon .sun { display: none; }
:root[data-theme="dark"] .s-icon .sun { display: block; } :root[data-theme="dark"] .s-icon .moon { display: none; }
/* Usage ring: share of the demo budget spent; red when the API is paused */
.s-usage { --p: 0; }
.s-usage .ring { width: 18px; height: 18px; border-radius: 50%; background: conic-gradient(var(--ub, var(--ok)) calc(var(--p) * 1%), var(--line-strong) 0); position: relative; }
.s-usage .ring::after { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--rail); }
.s-usage.near { --ub: var(--warn); } .s-usage.paused { --ub: var(--err); --p: 100; }
.s-usage.paused::after { content: ""; position: absolute; top: 5px; right: 5px; width: 7px; height: 7px; border-radius: 50%; background: var(--err); box-shadow: 0 0 0 2px var(--rail); }

/* Popover menus (docs, usage) opening beside the rail */
.s-pop { position: fixed; z-index: 80; min-width: 240px; max-width: min(340px, calc(100vw - 24px)); background: var(--panel); border: 1px solid var(--line-strong);
         border-radius: 12px; box-shadow: var(--shadow-lg); padding: 6px; font-size: 13px; }
.s-pop h4 { margin: 6px 8px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 650; }
.s-pop a, .s-pop button.item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 9px; border-radius: 7px; color: var(--text); text-decoration: none;
                                 background: none; border: 0; font: inherit; cursor: pointer; text-align: left; }
.s-pop a:hover, .s-pop button.item:hover { background: var(--panel-2); }
.s-pop a small, .s-pop button.item small { margin-left: auto; color: var(--faint); font: 11px var(--mono); }
.s-pop .pad { padding: 6px 9px 8px; }
.s-pop .kv { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; }
.s-pop .kv b { font-variant-numeric: tabular-nums; }
.s-pop .bar { height: 5px; border-radius: 3px; background: var(--panel-2); overflow: hidden; margin: 8px 0 6px; }
.s-pop .bar > span { display: block; height: 100%; background: var(--ok); }

/* Command palette (Ctrl/Cmd + K) */
.s-cmdk { position: fixed; inset: 0; z-index: 85; background: rgba(5, 5, 8, .45); backdrop-filter: blur(2px); display: flex; justify-content: center; align-items: flex-start; padding: 12vh 16px 16px; }
:root[data-theme="dark"] .s-cmdk { background: rgba(0, 0, 0, .6); }
.s-cmdk-box { width: min(620px, 100%); background: var(--panel); border: 1px solid var(--line-strong); border-radius: 14px; box-shadow: var(--shadow-lg); overflow: hidden;
              animation: pop .14s ease-out; }
@keyframes pop { from { transform: translateY(-6px) scale(.985); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .s-cmdk-box { animation: none; } }
.s-cmdk-in { display: flex; align-items: center; gap: 10px; padding: 0 14px; border-bottom: 1px solid var(--line); }
.s-cmdk-in svg { width: 17px; height: 17px; color: var(--muted); flex: none; }
.s-cmdk-in input { border: 0; background: none; box-shadow: none !important; padding: 15px 0; font-size: 15px; }
.s-cmdk-list { max-height: min(420px, 60vh); overflow: auto; padding: 6px; }
.s-cmdk-grp { padding: 8px 10px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); font-weight: 650; }
.s-cmdk-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; color: var(--text); }
.s-cmdk-item .ic { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 6px; background: var(--panel-2); border: 1px solid var(--line); color: var(--muted); flex: none; }
.s-cmdk-item .ic svg { width: 13px; height: 13px; }
.s-cmdk-item .l { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.s-cmdk-item small { margin-left: auto; color: var(--faint); font: 11px var(--mono); white-space: nowrap; }
.s-cmdk-item[aria-selected="true"] { background: var(--panel-2); }
.s-cmdk-item[aria-selected="true"] .ic { color: var(--accent); }
.s-cmdk-foot { display: flex; gap: 14px; padding: 8px 14px; border-top: 1px solid var(--line); color: var(--faint); font-size: 11.5px; }

/* Voice input: a mic button inside any field marked data-mic */
.mic-wrap { position: relative; }
.mic-wrap > textarea { padding-right: 48px; }
.mic-wrap > input { padding-right: 44px; }
.mic-btn { position: absolute; right: 8px; bottom: 8px; width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line);
           background: var(--panel); color: var(--muted); display: grid; place-items: center; cursor: pointer; }
.mic-btn:hover { color: var(--text); border-color: var(--line-strong); }
.mic-wrap > input + .mic-btn { top: 50%; bottom: auto; transform: translateY(-50%); width: 28px; height: 28px; }
.mic-btn svg { width: 15px; height: 15px; }
.mic-btn.busy { cursor: progress; border-color: var(--accent); }
.mic-btn .spinner { width: 14px; height: 14px; }
.mic-btn.on { background: var(--err); border-color: var(--err); color: #fff; animation: micpulse 1.4s ease-out infinite; }
@keyframes micpulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--err) 55%, transparent); } 100% { box-shadow: 0 0 0 10px transparent; } }
@media (prefers-reduced-motion: reduce) { .mic-btn.on { animation: none; } }

/* Alert bar fixed to the bottom, shown only when the Claude API is paused or the budget is used up */
body.has-usage-bar { --bottom-h: 42px; padding-bottom: 42px; }
.usage-bar { position: fixed; left: var(--rail-w); right: 0; bottom: 0; z-index: 30; border-top: 1px solid var(--err);
             background: color-mix(in srgb, var(--err-bg) 94%, transparent); backdrop-filter: blur(10px); font-size: 13px; color: var(--err); }
.ub-in { padding: 8px 20px; display: flex; align-items: center; gap: 10px; min-height: 41px; }
.ub-state { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }
.ub-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--err); box-shadow: 0 0 0 3px color-mix(in srgb, var(--err) 25%, transparent); }

/* Demo accounts: the avatar in the rail and the sign-in dialog */
.s-acct { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; border: 0; background: none; cursor: pointer; padding: 0; }
.s-acct:hover { background: var(--panel-2); }
.s-acct .who { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 11.5px; font-weight: 700; color: var(--on-primary); background: var(--primary); }
.s-acct.guest .who { background: var(--panel-2); color: var(--muted); border: 1px dashed var(--line-strong); }
.s-acct .nm { display: none; }
.s-modal { position: fixed; inset: 0; z-index: 90; background: rgba(5, 5, 8, .55); backdrop-filter: blur(2px); display: grid; place-items: center; padding: 16px; }
.s-modal-box { width: min(440px, 100%); background: var(--panel); border: 1px solid var(--line-strong); border-radius: 14px; padding: 22px; box-shadow: var(--shadow-lg); }
.s-modal-box h2 { margin: 0 0 6px; }
.s-accts { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; margin: 12px 0 14px; }
.s-accts button { text-align: left; border: 1px solid var(--line-strong); background: var(--sunken); color: var(--text); border-radius: 10px; padding: 8px 10px; font: inherit; font-size: 13px; cursor: pointer; }
.s-accts button:hover, .s-accts button[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--sunken)); }
.s-accts small { display: block; color: var(--muted); font: 11.5px var(--mono); }
.s-modal-box form { display: grid; gap: 8px; }

/* Phones and small tablets: the rail becomes a top bar */
@media (max-width: 760px) {
  :root { --rail-w: 0px; --top-h: 52px; }
  body { padding-top: var(--top-h); }
  .s-bar { right: 0; bottom: auto; width: auto; height: var(--top-h); flex-direction: row; padding: 0 8px; border-right: 0; border-bottom: 1px solid var(--line);
           background: color-mix(in srgb, var(--rail) 90%, transparent); backdrop-filter: blur(12px); }
  .s-brand { width: 38px; height: 38px; margin: 0; }
  .s-apps { flex-direction: row; width: auto; padding: 0; gap: 2px; overflow-x: auto; scrollbar-width: none; }
  .s-app { flex-direction: row; gap: 6px; padding: 7px 10px; font-size: 12.5px; }
  .s-app svg { width: 16px; height: 16px; }
  .s-app[aria-current="page"]::before { left: 10px; right: 10px; top: auto; bottom: -7px; width: auto; height: 2px; border-radius: 2px; }
  .s-live { top: 4px; right: 4px; }
  .s-right { margin: 0 0 0 auto; flex-direction: row; gap: 2px; }
  .s-sep { display: none; }
  .s-app[data-suite-link="hub"] .s-app-l { display: none; }
}
@media (max-width: 420px) { .s-app .s-app-l { display: none; } .s-app { padding: 8px; } }
.s-logo { box-shadow: 0 0 0 1px var(--line); }
</style>

<style>
  /* Gmail-like layout: folders and labels on the left, the mail list or a thread on the right. */
  :root { --p-support: #1a73e8; --p-account: #a15c00; --p-sales: #188038; --p-care: #c5221f; --p-other: #5f6368; --lbl-l: 36%; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --lbl-l: 74%; } }
  :root[data-theme="dark"] { --lbl-l: 74%; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --p-support: #8ab4f8; --p-account: #fdd663; --p-sales: #81c995; --p-care: #f28b82; --p-other: #9aa0a6; } }
  :root[data-theme="dark"] { --p-support: #8ab4f8; --p-account: #fdd663; --p-sales: #81c995; --p-care: #f28b82; --p-other: #9aa0a6; }

  /* Fills the window beside the rail, like the other agents: folders on the left, mail on the right. */
  .gm { display: grid; grid-template-columns: 260px minmax(0, 1fr);
        height: calc(100dvh - var(--top-h) - var(--bottom-h)); min-height: 480px; }
  @media (min-width: 901px) { body[data-app="inbox"] { height: 100dvh; overflow: hidden; } }
  .gm-side { overflow: auto; padding: 12px 8px 16px; scrollbar-width: thin; background: var(--sunken); border-right: 1px solid var(--line); }
  .gm-compose { display: inline-flex; align-items: center; gap: 12px; padding: 16px 24px 16px 18px; border-radius: 16px; border: 0; cursor: pointer;
                background: color-mix(in srgb, var(--accent) 20%, var(--panel)); color: var(--text); font: inherit; font-weight: 600; margin: 0 0 14px 8px; box-shadow: var(--shadow); }
  .gm-compose:hover { box-shadow: 0 2px 6px rgba(0, 0, 0, .2); }
  .gm-compose svg { width: 22px; height: 22px; }
  .gm-nav a, .gm-nav button { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 32px; padding: 0 14px 0 20px; border: 0; background: none;
               border-radius: 0 16px 16px 0; color: var(--text); text-decoration: none; font: inherit; font-size: 14px; cursor: pointer; text-align: left; }
  .gm-nav a:hover, .gm-nav button:hover { background: var(--panel-2); }
  .gm-nav a[aria-current="page"], .gm-nav button[aria-current="page"] { background: color-mix(in srgb, var(--accent) 22%, var(--panel)); font-weight: 700; }
  .gm-nav .n { margin-left: auto; font-size: 12px; font-weight: 650; }
  .gm-nav svg { width: 18px; height: 18px; flex: none; color: var(--muted); }
  .gm-nav a[aria-current="page"] svg { color: var(--text); }
  .gm-sec { display: flex; align-items: center; justify-content: space-between; padding: 16px 14px 4px 20px; font-size: 14px; font-weight: 600; }
  .gm-sec a { color: var(--muted); font-size: 12px; font-weight: 500; }
  .gm-parent { font-weight: 600; }
  .gm-parent .caret { width: 14px; transition: transform .15s; }
  .gm-parent[aria-expanded="false"] .caret { transform: rotate(-90deg); }
  .gm-nav .child { padding-left: 46px; }
  .ldot { width: 11px; height: 11px; border-radius: 3px; background: var(--c); flex: none; }
  .gm-nav .ldot.parent { border-radius: 50%; }

  .gm-main { background: var(--bg); display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
  .gm-top { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  .gm-search { flex: 1; max-width: 720px; position: relative; }
  .gm-search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); }
  .gm-search input { border-radius: 999px; background: var(--panel-2); border-color: transparent; padding: 10px 16px 10px 44px; }
  .gm-search input:focus { background: var(--panel); }
  .gm-tool { border: 0; background: none; color: var(--muted); width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; flex: none; }
  .gm-tool:hover { background: var(--panel-2); color: var(--text); }
  .gm-tool svg { width: 20px; height: 20px; }
  .gm-menu { display: none; }
  .gm-head { display: flex; gap: 10px; align-items: center; padding: 10px 16px 8px; font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .gm-head h2 { color: var(--text); font-size: 16px; margin: 0; display: flex; gap: 8px; align-items: center; }
  .gm-body { flex: 1; overflow: auto; }

  .gm-row { display: grid; grid-template-columns: 16px 200px minmax(0, 1fr) auto 64px; grid-template-areas: "imp from mid st date"; gap: 12px; align-items: center;
            padding: 0 16px; min-height: 42px; border-bottom: 1px solid var(--line); color: var(--text); text-decoration: none; font-size: 14px;
            background: color-mix(in srgb, var(--panel-2) 45%, var(--panel)); }
  .gm-row:hover { box-shadow: inset 1px 0 0 var(--line-strong), inset -1px 0 0 var(--line-strong), 0 1px 4px rgba(0, 0, 0, .14); position: relative; z-index: 1; }
  .gm-row.unread { background: var(--panel); }
  .gm-row.unread .from, .gm-row.unread .subj, .gm-row.unread .date { font-weight: 700; }
  .gm-row .imp { grid-area: imp; width: 12px; height: 12px; }
  .gm-row .imp.critical { color: var(--err); } .gm-row .imp.high { color: var(--warn); }
  .gm-row .from { grid-area: from; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gm-row .mid { grid-area: mid; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gm-row .snip { color: var(--muted); }
  .gm-row .st { grid-area: st; }
  .gm-row .date { grid-area: date; text-align: right; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .gm-row.unread .date { color: var(--text); }
  .lbl { display: inline-block; padding: 0 6px; border-radius: 4px; font-size: 12px; font-weight: 600; line-height: 19px; vertical-align: 1px; margin-right: 6px;
         background: color-mix(in srgb, var(--c) 15%, transparent); color: var(--c); white-space: nowrap; text-decoration: none; }
  a.lbl:hover { background: color-mix(in srgb, var(--c) 25%, transparent); }
  .st { font-size: 12px; font-weight: 650; display: inline-flex; gap: 5px; align-items: center; color: var(--muted); white-space: nowrap; }
  .st::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .st.new { color: var(--info); } .st.drafted { color: var(--warn); } .st.sent, .st.archived { color: var(--ok); } .st.escalated { color: var(--accent); } .st.failed { color: var(--err); }
  .tip { margin: 12px 16px; padding: 12px 14px; border-radius: 12px; background: color-mix(in srgb, var(--accent) 8%, var(--panel)); border: 1px solid var(--line); }
  .tip .try { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }

  /* A thread */
  .gm-thread { padding: 8px 24px 40px; max-width: 1040px; }
  .gm-subject { font-size: 22px; font-weight: 450; margin: 6px 0 4px 52px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .msg { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; padding: 16px 0; border-bottom: 1px solid var(--line); }
  .av { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 650; font-size: 16px; }
  .msg-head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .msg-head .meta { font-size: 12px; }
  .msg-head .when { margin-left: auto; }
  .msg-body { white-space: pre-wrap; margin-top: 10px; overflow-wrap: anywhere; }
  .msg.earlier .msg-body { color: var(--muted); }
  .assist { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin: 16px 0 16px 52px; background: color-mix(in srgb, var(--accent) 5%, var(--panel)); }
  .assist h3 { margin: 0 0 8px; font-size: 14px; display: flex; gap: 8px; align-items: center; }
  .assist h3 svg { width: 18px; height: 18px; color: var(--accent); }
  .ev { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-top: 8px; background: var(--panel); }
  .flag { padding: 8px 12px; border-radius: 9px; margin-top: 6px; font-size: 14px; }
  .flag.block { background: var(--err-bg); color: var(--err); } .flag.warn { background: var(--warn-bg); color: var(--warn); } .flag.info { background: var(--info-bg); color: var(--info); }
  .reply { border: 1px solid var(--line-strong); border-radius: 12px; box-shadow: var(--shadow); margin-left: 52px; background: var(--panel); }
  .reply-to { padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .reply input.subj { border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: transparent; padding: 10px 14px; }
  .reply textarea { border: 0; border-radius: 0; background: transparent; min-height: 230px; padding: 12px 14px; }
  .reply input.subj:focus, .reply textarea:focus { box-shadow: none; }
  .reply-foot { padding: 10px 14px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; border-top: 1px solid var(--line); }
  .reply-foot input { width: auto; padding: 7px 10px; font-size: 14px; }
  .reply-foot .why { flex: 1; min-width: 180px; }
  .btn.pill { border-radius: 999px; padding: 9px 22px; }
  .gm-history { margin: 16px 0 0 52px; }
  details summary { cursor: pointer; color: var(--muted); font-size: 13px; }

  /* Compose: a window docked bottom right, like Gmail's */
  .cw { position: fixed; right: 24px; bottom: var(--bottom-h); width: min(540px, calc(100vw - 24px)); background: var(--panel); border: 1px solid var(--line-strong); z-index: 55;
        border-radius: 12px 12px 0 0; box-shadow: 0 8px 32px rgba(0, 0, 0, .32); display: flex; flex-direction: column; }
  .cw-head { background: var(--panel-2); padding: 10px 10px 10px 16px; font-weight: 600; font-size: 14px; display: flex; align-items: center; border-radius: 12px 12px 0 0; }
  .cw-head button { margin-left: auto; }
  .cw .hint { padding: 8px 16px 0; font-size: 12px; color: var(--muted); }
  .cw input, .cw textarea { border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: transparent; padding: 9px 16px; }
  .cw input:focus, .cw textarea:focus { box-shadow: none; border-color: var(--accent); }
  .cw textarea { min-height: 220px; border-bottom: 0; }
  .cw-foot { display: flex; gap: 12px; padding: 10px 16px 14px; align-items: center; flex-wrap: wrap; font-size: 13px; }
  .cw-foot label { display: flex; gap: 6px; align-items: center; color: var(--muted); }
  .cw-foot input[type="checkbox"] { width: auto; }
  .cw.min textarea, .cw.min input, .cw.min .hint, .cw.min .cw-foot { display: none; }

  /* Settings, autonomy, learning pages */
  .gm-page { padding: 18px 24px 40px; max-width: 1040px; }
  .gm-page h2 { font-size: 20px; font-weight: 500; margin-bottom: 4px; }
  .set-x { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; margin: 14px 0 6px; }
  .set-x input[type="number"] { width: 90px; font-size: 20px; font-weight: 650; text-align: center; }
  .set-x input[type="range"] { flex: 1; min-width: 160px; padding: 0; accent-color: var(--accent); }
  .set-group { border: 1px solid var(--line); border-radius: 12px; margin-top: 14px; overflow: hidden; }
  .set-group > header { display: flex; gap: 10px; align-items: center; padding: 10px 16px; background: var(--panel-2); }
  .set-group > header .meta { margin-left: auto; }
  .set-row { display: grid; grid-template-columns: minmax(0, 1fr) 90px 170px 60px; gap: 14px; align-items: center; padding: 10px 16px; border-top: 1px solid var(--line); }
  .set-row .def { font-size: 12px; color: var(--muted); }
  .meter { height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; margin-top: 4px; }
  .meter > div { height: 100%; background: var(--accent); }
  .switch { position: relative; width: 38px; height: 22px; flex: none; justify-self: end; }
  .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; width: 100%; height: 100%; padding: 0; }
  .switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--line-strong); transition: background .15s; }
  .switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0, 0, 0, .3); }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(16px); }
  .switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  .save-bar { position: sticky; bottom: 0; background: var(--panel); padding: 12px 0; display: flex; gap: 10px; align-items: center; border-top: 1px solid var(--line); margin-top: 16px; }

  /* Settings: the category editor */
  .cat-row { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr) minmax(0, 2fr) 130px 44px 32px; gap: 8px; align-items: center; padding: 8px 12px; border-top: 1px solid var(--line); }
  .cat-row input { padding: 6px 9px; font-size: 13.5px; }
  .cat-row .prog .meta { font-size: 12px; }
  .cat-head { font-size: 12px; color: var(--muted); font-weight: 650; text-transform: uppercase; letter-spacing: .04em; border-top: 0; padding-bottom: 2px; }
  @media (max-width: 900px) { .cat-row { grid-template-columns: 1fr 1fr; } .cat-row .d, .cat-row .prog { grid-column: 1 / -1; } .cat-head { display: none; } }
  .thread-acts { display: inline-flex; gap: 2px; }
  .gbox { margin: 0 10px 12px 8px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; font-size: 13px; }
  .gbox .who { font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; gap: 6px; align-items: center; }
  .gbox .who::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
  .gbox .who.err::before { background: var(--err); }
  .gbox .row { margin-top: 8px; }
  .gbtn { display: inline-flex; align-items: center; gap: 8px; width: 100%; justify-content: center; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line-strong);
          background: var(--panel); color: var(--text); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none; }
  .gbtn:hover { background: var(--panel-2); }
  .gbtn svg { width: 16px; height: 16px; }
  @media (max-width: 900px) {
    .gm { grid-template-columns: minmax(0, 1fr); }
    .gm-side { display: none; position: fixed; inset: var(--top-h) auto var(--bottom-h) var(--rail-w); width: 270px; z-index: 40; background: var(--panel); border-right: 1px solid var(--line); box-shadow: 0 0 30px rgba(0, 0, 0, .3); padding-top: 12px; }
    .gm.side-open .gm-side { display: block; }
    .gm-menu { display: grid; }
    .gm-main { min-height: 0; }
    .gm-row { grid-template-columns: 12px minmax(0, 1fr) auto; grid-template-areas: "imp from date" ". mid mid" ". st st"; gap: 2px 10px; padding: 10px 12px; }
    .gm-row .st:empty { display: none; }
    .gm-thread, .gm-page { padding: 8px 12px 32px; }
    .gm-subject, .assist, .reply, .gm-history { margin-left: 0; }
    .msg { grid-template-columns: 32px minmax(0, 1fr); } .av { width: 32px; height: 32px; font-size: 14px; }
    .set-row { grid-template-columns: minmax(0, 1fr) auto; } .set-row .prog { grid-column: 1 / -1; } .set-row .risk { display: none; }
    .cw { right: 12px; }
  }
</style>

<script>
// Shared behaviour for the suite bar. Edit here, then run  python scripts/sync_suite.py
// Links between the three services work both locally (ports 8001-8003) and deployed
// (kb. / inbox. / scope. subdomains of one host, with the hub page on the bare host).
// Locally the hub page is served on port 8000:  python -m http.server 8000 -d deploy/site
(function () {
  const ports = { hub: 8000, kb: 8001, inbox: 8002, scope: 8003 };
  const { protocol, hostname } = location;
  const sub = hostname.match(/^(kb|inbox|scope)\.(.+)$/);
  const base = sub ? sub[2] : hostname;
  const deployed = !location.port && !/^(localhost|127\.0\.0\.1|\[::1\])$/.test(hostname);
  const urlFor = (app) => app === "hub" && deployed ? `${protocol}//${base}/`
    : deployed ? `${protocol}//${app}.${base}/` : `${protocol}//${hostname}:${ports[app]}/`;
  const current = document.body.dataset.app;
  document.querySelectorAll("[data-suite-link]").forEach((a) => {
    a.href = urlFor(a.dataset.suiteLink);
    if (a.dataset.suiteLink === current) a.setAttribute("aria-current", "page");
  });
  const home = document.querySelector("[data-suite-home]");
  if (home) home.href = urlFor("hub");

  // The page's own status badge (#s-right) belongs next to the page title, not in the rail.
  const statusSlot = document.querySelector("[data-suite-status]") || document.querySelector(".app-head") || document.querySelector(".gm-top");
  if (statusSlot) statusSlot.append(document.getElementById("s-right"));

  // Live dots on the rail: is each agent's service answering? (no-cors: reachable is enough)
  async function ping() {
    await Promise.all(["kb", "inbox", "scope"].map(async (app) => {
      const dot = document.querySelector(`[data-live="${app}"]`); if (!dot) return;
      const ok = await fetch(`${urlFor(app)}health`, { mode: "no-cors", cache: "no-store" }).then(() => true, () => false);
      dot.className = `s-live ${ok ? "up" : "down"}`;
      const link = dot.parentElement;
      link.dataset.state = ok ? "online" : "offline";
      link.title = `${link.title.replace(/ · (online|offline)$/, "")} · ${ok ? "online" : "offline"}`;
    }));
    window.dispatchEvent(new Event("suite:live"));
  }
  ping(); setInterval(ping, 60000);

  // Light / dark toggle. The choice is shared by all three services: a cookie on the
  // parent host when deployed (subdomains share it), localStorage as a fallback.
  const root = document.documentElement;
  const effective = () => root.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const themeBtn = document.getElementById("s-theme");
  if (themeBtn) themeBtn.onclick = () => {
    const next = effective() === "dark" ? "light" : "dark";
    root.dataset.theme = next;
    try { localStorage.setItem("theme", next); } catch {}
    window.dispatchEvent(new Event("suite:theme"));
    document.cookie = `theme=${next}; path=/; max-age=31536000; SameSite=Lax${deployed ? `; domain=${base}` : ""}`;
  };

  // Demo accounts. Signing in is optional: guests share one workspace; a demo account keeps
  // its own inbox and scope projects across visits. Deployed only (the proxy routes /_auth).
  const acctSlot = document.getElementById("s-account");
  async function accountWidget() {
    if (!acctSlot || !deployed) return;
    let me;
    try { me = await fetch("/_auth/me").then((r) => r.ok ? r.json() : null); } catch { return; }
    if (!me) return;
    // A Google login (Connect Gmail) is named by a hash; show its address instead.
    const who = me.account?.startsWith("g_") ? decodeURIComponent((document.cookie.match(/(?:^|; )bl_who=([^;]*)/) || [])[1] || "Gmail account") : me.account;
    const initial = (who || "g").replace(/^demo/, "")[0].toUpperCase();
    const safe = String(who).replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
    acctSlot.innerHTML = me.account
      ? `<button class="s-acct" type="button" title="Signed in as ${safe}: your own inbox and projects. Click to sign out."><span class="who">${initial}</span><span class="nm">${safe}</span></button>`
      : `<button class="s-acct guest" type="button" title="You're in the shared guest workspace. Sign in with a demo account to keep your own work."><span class="who">G</span><span class="nm">Guest · Sign in</span></button>`;
    acctSlot.querySelector("button").onclick = me.account ? signOut : () => signInDialog(me.demo_accounts);
  }
  async function signOut() {
    if (!confirm("Sign out? Your work stays saved in this demo account for next time.")) return;
    await fetch("/_auth/logout", { method: "POST" }).catch(() => null);
    location.reload();
  }
  function signInDialog(accounts) {
    const wrap = Object.assign(document.createElement("div"), { className: "s-modal" });
    wrap.innerHTML = `<div class="s-modal-box" role="dialog" aria-modal="true" aria-labelledby="s-si-title">
      <h2 id="s-si-title">Sign in with a demo account</h2>
      <p class="meta" style="margin:0">Your inbox, drafts, learning and scope projects are saved to the account, so you can come back and pick up where you left off. Without signing in you share the guest workspace.</p>
      <div class="s-accts">${accounts.map((a) => `<button type="button" data-a="${a.account}" data-p="${a.password}">${a.account}<small>${a.password}</small></button>`).join("")}</div>
      <form><input name="account" placeholder="Account, e.g. demo1" autocomplete="username" required>
        <input name="password" type="password" placeholder="Password" autocomplete="current-password" required>
        <div class="row" style="margin-top:4px"><button class="btn">Sign in</button><button class="btn ghost" type="button" data-close>Cancel</button><span class="meta" data-msg></span></div></form></div>`;
    document.body.append(wrap);
    const form = wrap.querySelector("form");
    const close = () => { wrap.remove(); document.removeEventListener("keydown", onKey); };
    const onKey = (e) => { if (e.key === "Escape") close(); };
    document.addEventListener("keydown", onKey);
    wrap.onclick = (e) => { if (e.target === wrap) close(); };
    wrap.querySelector("[data-close]").onclick = close;
    wrap.querySelectorAll("[data-a]").forEach((b) => b.onclick = () => {
      form.account.value = b.dataset.a; form.password.value = b.dataset.p;
      wrap.querySelectorAll("[data-a]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
      form.querySelector(".btn").focus();
    });
    form.onsubmit = async (e) => {
      e.preventDefault();
      const msg = wrap.querySelector("[data-msg]");
      try {
        const r = await fetch("/_auth/login", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ account: form.account.value, password: form.password.value }) });
        if (!r.ok) { msg.textContent = (await r.json().catch(() => ({}))).detail || "Sign-in failed."; return; }
        location.reload();
      } catch { msg.textContent = "Couldn't reach the server."; }
    };
    form.account.focus();
  }
  accountWidget();

  // Popovers that open beside the rail button that triggered them.
  let openPop = null;
  function popover(btn, html) {
    if (openPop) { const same = openPop.btn === btn; openPop.close(); if (same) return null; }
    const pop = Object.assign(document.createElement("div"), { className: "s-pop", innerHTML: html });
    document.body.append(pop);
    const r = btn.getBoundingClientRect();
    if (innerWidth <= 760) { pop.style.top = `${r.bottom + 8}px`; pop.style.right = "8px"; }
    else { pop.style.left = `${r.right + 10}px`; pop.style.bottom = `${Math.max(8, innerHeight - r.bottom)}px`; }
    btn.setAttribute("aria-expanded", "true");

  // Voice input. First choice: the browser's own live dictation (words appear as you speak).

  // currently answering.

    const own = { kb: "/usage", inbox: "/api/usage", scope: "/api/usage" }[current];
    const get = (url) => fetch(url, { headers: { accept: "application/json" } }).then((r) => r.ok ? r.json() : null).catch(() => null);
    const money = (v) => `$${v < 1 ? v.toFixed(3) : v.toFixed(2)}`;
    const ago = (iso) => { if (!iso) return "never"; const m = Math.round((Date.now() - Date.parse(iso)) / 60000); return m < 1 ? "just now" : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} d ago`; };

      if (/security token|token (has )?expired|expiredtoken|unrecognizedclient|signature|invalid.*(bearer|api.?key)|401/i.test(m)) return "AWS credentials rejected or expired";
      if (/don't have access to the model|not authorized|accessdenied|403/i.test(m)) return "no access to this model in Bedrock";
      if (/inference profile|on-demand throughput/i.test(m)) return "model id needs an inference profile";

        <div class="kv"><span>${esc(u.headline)}</span></div>
        ${u.pct !== null ? `<div class="bar"><span style="width:${u.pct}%;background:var(${u.paused ? "--err" : u.near ? "--warn" : "--ok"})"></span></div>` : ""}
        <div class="kv"><span class="muted">Today</span><b>${money(u.today)}</b></div>
        <div class="kv"><span class="muted">Total</span><b>${money(u.total)}${u.budget ? ` <span class="muted">of $${Number(u.budget).toFixed(2)}</span>` : ""}</b></div>
        <div class="kv"><span class="muted">Last AI call</span><b>${ago(u.lastOk)}</b></div>
        <p class="meta" style="margin:8px 0 0">Spend recorded by ${esc(u.scope)} from each call's token counts at Anthropic's list prices. Claude runs on Amazon Bedrock: actual charges and remaining credits are in AWS Billing, and can be a little higher (regional profiles such as au. cost about 10% more).</p></div>`;
    };
    if (btn) btn.onclick = () => popover(btn, details());
    async function refresh() {
      let parts, budget = null, scope = "this site";
      if (deployed) {
        const [kb, inbox, sc, b] = await Promise.all(["kb", "inbox", "scope", "budget"].map((k) => get(`/_usage/${k}`)));
        parts = [kb, inbox, sc].filter(Boolean); budget = b?.budget_usd ?? null;
        // The Inbox Agent's figure already includes its Knowledge Brain lookups: count them once.
        if (kb && inbox?.includes_kb_lookups) {
          const dup = kb.by_caller?.["inbox-agent"] || { usd: 0, today_usd: 0 };
          parts = parts.map((p) => p === kb ? { ...kb, total_usd: kb.total_usd - dup.usd, today_usd: kb.today_usd - dup.today_usd } : p);
        }
      } else {
        const mine = own ? await get(own) : null;

      const lastErr = parts.map((p) => p.last_error).filter(Boolean).sort((a, b) => a.at < b.at ? -1 : 1).at(-1) || null;

        btn.style.setProperty("--p", pct !== null ? pct.toFixed(1) : "0");

  // Command palette (Ctrl/Cmd + K): jump between agents, run page commands, or hand a
  // question straight to the Knowledge Brain. Pages add their own with suite.commands([...]).
  const ICON = {
    go: '<path d="M5 12h14M13 6l6 6-6 6"/>',
    ask: '<path d="M12 3v3M12 18v3M3 12h3M18 12h3"/><path d="M12 7.5 13.6 10.4 16.5 12 13.6 13.6 12 16.5 10.4 13.6 7.5 12 10.4 10.4z"/>',
    doc: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>',
    theme: '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',

    cmd: '<path d="m9 18 6-12"/>',

  const pageCommands = [];
  const AGENTS = [["hub", "Home", "start a task"], ["kb", "Knowledge Brain", "Task 1"], ["inbox", "Inbox Agent", "Task 2"], ["scope", "Scope Builder", "Task 3"]];
  function allCommands(q) {
    const list = [
      ...pageCommands,
      ...AGENTS.filter(([a]) => a !== current).map(([a, l, h]) => ({ group: "Go to", label: l, hint: h, icon: "go", run: () => { location.href = urlFor(a); } })),
      { group: "Preferences", label: "Switch light / dark mode", icon: "theme", keywords: "theme dark light", run: () => themeBtn?.click() },
      ...DOCS.map(([l, u, f]) => ({ group: "Read more", label: l, hint: f, icon: "doc", run: () => window.open(u, "_blank", "noopener") })),
    ];
    const words = q.toLowerCase().split(/\s+/).filter(Boolean);
    const hits = list.filter((c) => words.every((w) => `${c.group} ${c.label} ${c.hint || ""} ${c.keywords || ""}`.toLowerCase().includes(w)));
    if (q.trim().length < 3) return hits;
    const ask = { group: "Ask", label: `Ask the Knowledge Brain: “${q.trim()}”`, icon: "ask",
                  run: () => current === "kb" && window.suite.ask ? window.suite.ask(q.trim()) : (location.href = `${urlFor("kb")}?q=${encodeURIComponent(q.trim())}`) };

  }
  function palette(initial = "") {
    if (document.querySelector(".s-cmdk")) return;
    openPop?.close();
    const wrap = Object.assign(document.createElement("div"), { className: "s-cmdk" });
    wrap.innerHTML = `<div class="s-cmdk-box" role="dialog" aria-modal="true" aria-label="Commands">
      <div class="s-cmdk-in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>

    url: urlFor,
    palette,
    /** Add page commands to the palette: [{ group, label, hint?, keywords?, icon?, run }] */
    commands(list) { pageCommands.push(...list); },

    },
    lightbox(src, alt) {
      const box = Object.assign(document.createElement("div"), { className: "lightbox", title: "Click or press Esc to close" });
      const img = Object.assign(document.createElement("img"), { src, alt: alt || "" });
      box.append(img); document.body.append(box);

    },

    // reviewer can act on.
    friendlyError(text) {
      const raw = String(text ?? "");
      if (/credit balance is too low|payment|billing|insufficient.*credit|credits? (are )?(exhausted|expired)/i.test(raw)) return "The AWS account's credits for Claude are used up, so AI features are paused. Everything else still works.";
      if (/overloaded|529|serviceunavailable|model ?not ?ready|503/i.test(raw)) return "Claude on Amazon Bedrock is busy right now. Please try again in a minute.";
      if (/throttl|too many requests|rate.?limit|429/i.test(raw)) return "Too many requests to Claude on Amazon Bedrock right now. Please try again in a minute.";
      if (/security token|token (has )?expired|expiredtoken|unrecognizedclient|signature|authentication|invalid x-api-key|401/i.test(raw)) return "The AWS credentials for Claude on Amazon Bedrock were rejected or have expired, so AI features are paused.";
      if (/don't have access to the model|not authorized|accessdenied|403/i.test(raw)) return "This AWS account has no access to the Claude model it asked for. Enable it under Bedrock model access.";

    },
    // Small, safe Markdown subset for model answers: paragraphs, numbered and bullet lists, **bold**.
    md(text) {

      const out = []; let list = null;
      const flush = () => { if (list) { out.push(`<${list.tag}>${list.items.join("")}</${list.tag}>`); list = null; } };
      for (const raw of String(text ?? "").split("\n")) {
        const line = raw.trimEnd();
        const num = line.match(/^\s*\d+[.)]\s+(.*)$/), bul = line.match(/^\s*[-*•]\s+(.*)$/);
        if (num || bul) {
          const tag = num ? "ol" : "ul";
          if (!list || list.tag !== tag) { flush(); list = { tag, items: [] }; }
          list.items.push(`<li>${inline((num || bul)[1])}</li>`);
        } else { flush(); if (line.trim()) out.push(`<p>${inline(line)}</p>`); }

    },
  };
})();
