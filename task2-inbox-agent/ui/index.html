const svg = (name, attrs = "") => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${attrs}>${ICON[name]}</svg>`;

const isDone = (e) => ["sent", "archived", "escalated", "spam", "trash"].includes(e.status);
const binned = (e) => e.status === "spam" || e.status === "trash";
const FOLDERS = [
  ["inbox", "Inbox", (e) => !isDone(e)],
  ["review", "Needs review", (e) => e.status === "drafted"],
  ["urgent", "Urgent", (e) => !isDone(e) && (e.urgency === "critical" || e.urgency === "high")],
  ["sent", "Sent", (e) => e.status === "sent" && e.sent_mode !== "auto"],
  ["auto", "Auto-sent", (e) => e.sent_mode === "auto"],
  ["escalated", "Escalated", (e) => e.status === "escalated"],
  ["archived", "Archived", (e) => e.status === "archived"],
  ["all", "All mail", (e) => !binned(e)],
  ["spam", "Spam", (e) => e.status === "spam"],
  ["trash", "Trash", (e) => e.status === "trash"],
];
const TOOLS = [["autonomy", "Autonomy"], ["learning", "Learning"], ["settings", "Settings"]];

let emails = [], draftingOn = false, account = null, lastList = "#/folder/inbox", gmail = { configured: false, connected: false };
// Email categories (Header, Filters...) under their parent setting type, from Settings.
let META = { topics: [], parents: [], request_types: [], autonomy_threshold: 20 };
const topicOf = (id) => META.topics.find((t) => t.id === id) || META.topics.find((t) => t.id === "other");
const hue = (text) => { let h = 7; for (const ch of String(text)) h = (h * 31 + ch.charCodeAt(0)) % 360; return h; };
const parentColor = (parent) => `hsl(${hue(parent)} 62% var(--lbl-l))`;
const colorOf = (id) => parentColor(topicOf(id)?.parent || "General");
const parentName = (id) => topicOf(id)?.parent || "";
const chip = (id, link = true) => {
  if (!id) return "";
  const t = topicOf(id);
  const tag = link ? `a href="#/label/${esc(id)}"` : "span";
  return `<${tag} data-cat="${esc(id)}" class="lbl" style="--c:${colorOf(id)}" title="${esc(t?.parent || "")} › ${esc(t?.label || id)}">${esc(t?.label || id)}</${link ? "a" : "span"}>`;
};
/** The request type (how-to, refund...): the safety layer, shown next to the category. */
const typeChip = (cat) => cat ? `<span class="badge" title="Request type">${esc(CAT[cat] || cat)}</span>` : "";
let collapsed = new Set(); try { collapsed = new Set(JSON.parse(localStorage.getItem("inbox-collapsed") || "[]")); } catch {}

function reviewer() { try { return localStorage.getItem("reviewer") || account || "Reviewer"; } catch { return account || "Reviewer"; } }
function saveReviewer(v) { try { localStorage.setItem("reviewer", v); } catch {} }

async function api(path, options = {}) {
  let res;
  const headers = options.body ? { "content-type": "application/json" } : {};
  try { res = await fetch(path, { ...options, headers }); }
  catch { banner("The Inbox Agent isn't reachable."); throw new Error("offline"); }
  const body = await res.json().catch(() => ({}));
  if (!res.ok) { const e = new Error(body.error || `Error ${res.status}`); e.status = res.status; throw e; }
  $("#banner").hidden = true;
  return body;
}
function banner(msg, kind = "err") { const b = $("#banner"); b.className = `banner ${kind}`; b.textContent = msg; b.hidden = false; }

function when(iso, long = false) {
  const d = new Date(iso); if (isNaN(d)) return esc(iso);
  if (long) return d.toLocaleString([], { dateStyle: "medium", timeStyle: "short" });
  const now = new Date();
  if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  return d.toLocaleDateString([], d.getFullYear() === now.getFullYear() ? { month: "short", day: "numeric" } : { dateStyle: "short" });
}
function avatar(name) {
  let h = 0; for (const c of String(name)) h = (h * 31 + c.charCodeAt(0)) % 360;
  return `<div class="av" style="background:hsl(${h} 45% 42%)" aria-hidden="true">${esc((String(name).trim()[0] || "?").toUpperCase())}</div>`;
}

// ----- routing: #/folder/inbox, #/label/how_to, #/parent/support, #/mail/E001, #/settings ...
function route() {
  const [, kind = "folder", arg = "inbox"] = (location.hash || "#/folder/inbox").split("/").map(decodeURIComponent);
  return { kind, arg };
}
// A new page starts at its top; re-rendering the same page (after an action) keeps its place.
window.addEventListener("hashchange", () => { $("#view").scrollTop = 0; render(); });
function render() {
  const r = route();
  if (["folder", "label", "parent"].includes(r.kind)) lastList = location.hash || "#/folder/inbox";
  $("#gm").classList.remove("side-open");
  renderSide(r);
  if (r.kind === "mail") return openEmail(r.arg);
  if (r.kind === "gmail-error") { banner(`Couldn't connect Gmail: ${r.arg}`, "warn"); history.replaceState(null, "", "#/folder/inbox"); return render(); }
  if (r.kind === "settings") return renderSettings();
  if (r.kind === "autonomy") return renderAutonomy();
  if (r.kind === "learning") return renderLearning();
  renderList(r);
}

function renderSide(r) {
  const cur = (k, a) => r.kind === k && r.arg === a ? ' aria-current="page"' : "";
  $("#folders").innerHTML = FOLDERS.map(([id, name, f]) => {
    const n = emails.filter(f).length;
    const showN = ["inbox", "review", "urgent", "spam"].includes(id) && n;
    return `<a href="#/folder/${id}"${cur("folder", id)}>${svg(id === "review" ? "review" : id)}${name}${showN ? `<span class="n">${n}</span>` : ""}</a>`;
  }).join("");
  $("#labels").innerHTML = META.parents.map((p) => {
    const kids = META.topics.filter((t) => t.parent === p);
    const open = !collapsed.has(p);
    const n = emails.filter((e) => !isDone(e) && e.topic && topicOf(e.topic)?.parent === p).length;
    return `<button class="gm-parent" type="button" aria-expanded="${open}" data-parent="${esc(p)}"${r.kind === "parent" && r.arg === p ? ' aria-current="page"' : ""} title="Parent setting type: ${esc(p)}" aria-label="${esc(p)}${n ? `, ${n} open` : ""}">${svg("caret", 'class="caret"')}<span class="ldot parent" style="--c:${parentColor(p)}"></span>${esc(p)}${n ? `<span class="n">${n}</span>` : ""}</button>
      ${open ? kids.map((t) => { const k = emails.filter((e) => !isDone(e) && e.topic === t.id).length;
        return `<a class="child" href="#/label/${esc(t.id)}"${cur("label", t.id)} title="${esc(t.description)}" aria-label="${esc(t.label)}${k ? `, ${k} open` : ""}"><span class="ldot" style="--c:${parentColor(p)}"></span>${esc(t.label)}${k ? `<span class="n">${k}</span>` : ""}</a>`; }).join("") : ""}`;
  }).join("");
  // The caret folds a parent type; the rest of the row opens all of its mail.
  $("#labels").querySelectorAll("[data-parent]").forEach((b) => b.onclick = (ev) => {
    const id = b.dataset.parent;
    if (!ev.target.closest(".caret")) { location.hash = `#/parent/${encodeURIComponent(id)}`; return; }
    collapsed.has(id) ? collapsed.delete(id) : collapsed.add(id);
    try { localStorage.setItem("inbox-collapsed", JSON.stringify([...collapsed])); } catch {}
    renderSide(route());
  });
  $("#tools").innerHTML = TOOLS.map(([id, name]) => `<a href="#/${id}"${r.kind === id ? ' aria-current="page"' : ""}>${svg(id)}${name}</a>`).join("");
}

// ----- Gmail: connect (signs in with Google: a private workspace), sync, disconnect
const GLOGO = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285f4" d="M2 6.5V18a2 2 0 0 0 2 2h3V10l5 3.8 5-3.8v10h3a2 2 0 0 0 2-2V6.5l-1.6-1.2A2 2 0 0 0 17 5.6L12 9.4 7 5.6a2 2 0 0 0-3.4.7z"/></svg>';
function renderGmailBox() {
  const box = $("#gmailbox");
  if (gmail.connected) {
    box.innerHTML = `<div class="gbox"><div class="who ${gmail.last_error ? "err" : ""}" title="This private workspace is linked to ${esc(gmail.email)}">${esc(gmail.email)}</div>
      <div class="meta">${gmail.last_error ? `<span style="color:var(--err)">${esc(gmail.last_error)}</span>` : gmail.last_sync_at ? `Synced ${esc(when(gmail.last_sync_at))}` : "First sync running…"}</div>
      <div class="row" style="gap:6px"><button class="btn secondary small" id="gsync" type="button">Sync now</button><button class="btn ghost small" id="gdisc" type="button">Disconnect</button></div></div>`;
    $("#gsync").onclick = gmailSyncNow;
    $("#gdisc").onclick = gmailDisconnect;
    if (/expired|revoked|connect Gmail again/i.test(gmail.last_error || "")) $(".gbox").insertAdjacentHTML("beforeend", `<a class="gbtn" style="margin-top:8px" href="/api/gmail/connect">${GLOGO}Reconnect Gmail</a>`);
  } else if (gmail.configured) {
    box.innerHTML = `<div class="gbox" style="border:0;padding:0"><a class="gbtn" href="/api/gmail/connect" title="Sign in with Google: your Gmail goes into a private workspace only that Google login can open">${GLOGO}Connect Gmail</a></div>`;
  } else box.innerHTML = "";
}
async function loadGmail() {
  gmail = await api("/api/gmail/status").catch(() => ({ configured: false, connected: false }));
  renderGmailBox();
}
async function gmailSyncNow() {
  const b = $("#gsync"); b.disabled = true; b.innerHTML = `<span class="spinner" style="width:12px;height:12px"></span>Syncing`;
  try {
    const r = await api("/api/gmail/sync", { method: "POST" });
    suite.toast(`Gmail: ${r.imported} new email(s)${r.drafted ? `, ${r.drafted} drafted` : ""}${r.auto_sent ? `, ${r.auto_sent} sent automatically` : ""}.`, 4000);
    window.dispatchEvent(new Event("suite:usage-changed"));
  } catch (e) { banner(suite.friendlyError(e.message), "warn"); }
  await Promise.all([loadGmail(), loadEmails()]);
}
async function gmailDisconnect() {
  if (!confirm(`Disconnect ${gmail.email}? Google's access is revoked and everything imported into this workspace is erased. Your Gmail itself is not changed.`)) return;
  try { await api("/api/gmail/disconnect", { method: "POST" }); location.href = "/"; }
  catch (e) { banner(e.message); }
}

// ----- the list
function renderList(r) {
  const q = $("#q").value.trim().toLowerCase();
  let title, items;
  if (r.kind === "label") { const t = topicOf(r.arg); title = `<span class="meta" style="font-weight:500">${esc(t?.parent || "")} ›</span> ${esc(t?.label || r.arg)}`; items = emails.filter((e) => e.topic === r.arg && !binned(e)); }
  else if (r.kind === "parent") { title = `${esc(r.arg)} <span class="meta" style="font-weight:500">· every category under it</span>`; items = emails.filter((e) => e.topic && topicOf(e.topic)?.parent === r.arg && !binned(e)); }
  else { const f = FOLDERS.find(([id]) => id === r.arg) || FOLDERS[0]; title = esc(f[1]); items = emails.filter(f[2]); }
  if (q) items = items.filter((e) => [e.from_name, e.from_email, e.subject, e.body, e.id, CAT[e.category], e.topic && topicOf(e.topic)?.label].some((x) => String(x ?? "").toLowerCase().includes(q)));
  items = [...items].sort((a, b) => String(b.received_at).localeCompare(String(a.received_at)));
  const v = $("#view");
  if (!emails.length) {
    v.innerHTML = `<div class="empty">This inbox is empty.<br><br><button class="btn" id="seed">Load the 40 sample emails</button></div>`;
    $("#seed").onclick = async () => { await api("/api/seed/dev", { method: "POST" }); await loadEmails(); };
    return;
  }
  const known = new Set(emails.map((e) => e.id));
  const tip = r.kind === "folder" && r.arg === "inbox" && !q && !emails.some((e) => e.status !== "new")
    ? `<div class="tip"><b>New here?</b> <span class="meta">Open an email and click <b>Draft a reply</b>. The agent labels it, asks the Knowledge Brain, and writes a reply for you to send, edit or escalate. Good ones to try:</span>
       <div class="try">${TRY.filter(([id]) => known.has(id)).map(([id, t]) => `<a class="chip" href="#/mail/${id}"><span><b>${id}</b> · ${esc(t)}</span></a>`).join("")}</div></div>` : "";
  v.innerHTML = `<div class="gm-head"><h2>${title}</h2><span>${items.length ? `1–${items.length} of ${items.length}` : ""}${q ? ` matching “${esc(q)}”` : ""}</span></div>${tip}` +
    (items.length ? items.map((e) => {
      const snip = String(e.body).replace(/\s+/g, " ").slice(0, 160);
      const st = e.status === "new" ? "" : `<span class="st ${esc(e.status)}">${esc(e.sent_mode === "auto" ? "Auto-sent" : STATUS[e.status] || e.status)}</span>`;
      return `<a class="gm-row ${e.status === "new" ? "unread" : ""}" href="#/mail/${encodeURIComponent(e.id)}">
        <svg class="imp ${esc(e.urgency || "")}" viewBox="0 0 12 12" aria-label="${e.urgency === "critical" || e.urgency === "high" ? esc(e.urgency) + " urgency" : ""}">${e.urgency === "critical" || e.urgency === "high" ? '<path d="M1 1h7l3 5-3 5H1l3-5z" fill="currentColor"/>' : ""}</svg>
        <span class="from">${esc(e.from_name)}</span>
        <span class="mid">${chip(e.topic, false)}<span class="subj">${esc(e.subject || "(no subject)")}</span><span class="snip"> – ${esc(snip)}</span></span>
        ${st || "<span></span>"}
        <span class="date" title="${esc(when(e.received_at, true))}">${when(e.received_at)}</span></a>`;
    }).join("") : `<div class="empty">${q ? "No mail matches your search." : "Nothing here."}</div>`);
  // Rows are links, so their label chips can't be links too (links don't nest): a click on
  // a chip opens that label instead of the email.
  v.querySelectorAll(".gm-row .lbl").forEach((el) => el.addEventListener("click", (ev) => { ev.preventDefault(); ev.stopPropagation(); location.hash = `#/label/${el.dataset.cat}`; }));
}

function deliveryNote(id) {
  const e = emails.find((x) => x.id === id);
  if (!e?.from_gmail) return "";
  if (e.delivery?.startsWith("gmail:")) return `<div class="meta" style="margin-top:8px;color:var(--ok)">✓ Sent from ${esc(gmail.email || "Gmail")}, in the same thread</div>`;
  if (e.delivery?.startsWith("error:")) return `<div class="banner warn" style="margin-top:8px">Not delivered to Gmail: ${esc(e.delivery.slice(7))} <button class="btn secondary small" data-redeliver="${esc(id)}">Retry</button></div>`;
  return `<div class="meta" style="margin-top:8px">Sending through Gmail…</div>`;
}

// ----- one thread
async function openEmail(id) {
  const v = $("#view");
  let data;
  try { data = await api(`/api/emails/${encodeURIComponent(id)}`); }
  catch (e) { v.innerHTML = `<div class="empty">${esc(e.status === 404 ? "That email isn't in this inbox." : e.message)}</div>`; return; }
  if (route().kind !== "mail" || route().arg !== id) return; // the visitor moved on meanwhile
  const { email, draft, reviews } = data;
  const c = draft?.classification;
  const acts = email.status === "spam"
    ? `<button class="btn secondary small" data-move="back">Not spam</button>`
    : email.status === "trash"
      ? `<button class="btn secondary small" data-move="back">${svg("restore", 'style="width:15px;height:15px"')}Restore</button>`
      : `<span class="thread-acts"><button class="gm-tool" data-move="spam" title="Report spam" aria-label="Report spam">${svg("spam")}</button><button class="gm-tool" data-move="trash" title="Delete (moves to Trash)" aria-label="Delete">${svg("trash")}</button></span>`;
  const head = `<div class="gm-top" style="border:0;padding:8px 16px 0"><a class="gm-tool" href="${esc(lastList)}" title="Back" aria-label="Back to the list">${svg("back")}</a>${acts}<span class="meta">${esc(email.id)}</span><span class="spacer"></span><span class="st ${esc(email.status)}">${esc(STATUS[email.status] || email.status)}</span></div>`;
  let html = `<div class="gm-subject">${esc(email.subject || "(no subject)")} ${c ? chip(c.topic) + typeChip(c.category) : ""}${c && URG[c.urgency] ? `<span class="badge ${URG[c.urgency]}">${esc(c.urgency)}</span>` : ""}</div>`;
  html += email.thread.map((t) => `<div class="msg earlier">${avatar(t.from)}<div><div class="msg-head"><b>${esc(t.from)}</b><span class="meta when">${esc(t.date)}</span></div><div class="msg-body">${esc(t.body)}</div></div></div>`).join("");
  html += `<div class="msg">${avatar(email.from_name)}<div><div class="msg-head"><b>${esc(email.from_name)}</b><span class="meta">&lt;${esc(email.from_email)}&gt;</span><span class="meta when">${esc(when(email.received_at, true))}</span></div><div class="meta">to support</div><div class="msg-body">${esc(email.body)}</div></div></div>`;
  if (email.status === "failed" && email.error) html += `<div class="banner warn" style="margin:12px 0 0 52px">The last attempt failed: ${esc(suite.friendlyError(email.error))}</div>`;

  if (!draft) {
    html += `<div class="assist"><h3>${svg("spark")}Inbox Agent</h3><p class="meta" style="margin:0 0 10px">Labels this email, asks the Knowledge Brain, and drafts a reply for you to review.</p>
      <div class="row" style="margin:0"><button class="btn pill" id="process" ${draftingOn ? "" : "disabled"}>Draft a reply</button><span class="meta" id="pmeta">${draftingOn ? "Usually 10–15 seconds." : "Drafting is off until Claude on Amazon Bedrock is configured."}</span></div></div>`;
    v.innerHTML = head + `<div class="gm-thread">${html}</div>`;
    wireMoves(v, id);
    if (draftingOn) $("#process").onclick = () => runProcess(id);
    return;
  }

  const topic = c.topic ? topicOf(c.topic) : null;
  html += `<div class="assist"><h3>${svg("spark")}Inbox Agent</h3>
    <div class="row" style="margin:0">${topic ? `${chip(c.topic)}<span class="meta">${esc(topic.parent)} › ${esc(topic.label)}</span>` : `<span class="meta">Drafted before categories existed: draft it again to sort it.</span>`}${typeChip(c.category)}${c.spam ? `<span class="badge err">spam</span>` : ""}<span class="badge">${esc(c.sentiment)}</span><span class="badge">${esc(c.language)}</span></div>
    <p class="meta" style="margin:8px 0 0">${esc(c.summary)}</p>`;
  if (draft.evidence.length) html += `<details style="margin-top:8px"${draft.evidence.length === 1 ? " open" : ""}><summary>What the Knowledge Brain said (${draft.evidence.length})</summary>` + draft.evidence.map((e) => `<div class="ev"><b>[${e.number}] ${esc(e.question)}</b> <span class="badge ${e.status === "answered" ? "ok" : "warn"}">${esc(e.status === "insufficient_evidence" ? "not covered" : e.status)}</span>${suite.md(e.answer)}<div class="meta">${e.sources.map((s) => s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>` : esc(s.title)).join(" · ")}</div></div>`).join("") + `</details>`;
  html += [
    ...draft.violations.map((x) => `<div class="flag ${x.severity}">${x.severity === "block" ? "Blocked from auto-send" : "Check"}: ${esc(x.message)}</div>`),
    draft.note_for_reviewer ? `<div class="flag info">Note: ${esc(draft.note_for_reviewer)}</div>` : "",
    draft.secrets_found ? `<div class="flag warn">A card number or password was removed before drafting. Don't paste it back.</div>` : "",
  ].join("");
  html += `<div class="meta" style="margin-top:8px">${esc(Object.values(draft.models).join(" · "))} · ${(draft.latency_ms / 1000).toFixed(1)} s · $${draft.cost_usd.toFixed(4)}${draft.auto_send_blocker ? ` · not auto-sent: ${esc(draft.auto_send_blocker)}` : ""}</div></div>`;

  const done = email.status !== "drafted";
  if (done) {
    const final = [...reviews].reverse().find((r) => r.final_body);
    const auto = reviews.some((r) => r.outcome === "auto_sent");
    if (email.status === "sent") {
      html += `<div class="msg">${avatar(auto ? "Inbox Agent" : reviewer())}<div><div class="msg-head"><b>${auto ? "Inbox Agent (sent automatically)" : esc(final?.reviewer || "You")}</b><span class="meta">to ${esc(email.from_email)}</span><span class="meta when">${esc(when((final || reviews.at(-1))?.created_at?.replace(" ", "T") + "Z", true))}</span></div><div class="meta">${esc(final?.final_subject || draft.subject)}</div><div class="msg-body">${esc(final?.final_body || draft.body)}</div>${deliveryNote(email.id)}</div></div>`;
    }
  } else {
    html += `<div class="reply"><div class="reply-to">Reply to <b style="color:var(--text)">${esc(email.from_name)}</b> &lt;${esc(email.from_email)}&gt; · drafted by the agent, edit freely</div>
      <input class="subj" id="subj" value="${esc(draft.subject)}" aria-label="Subject">
      <textarea id="body" data-mic aria-label="Reply">${esc(draft.body)}</textarea>
      <div class="reply-foot"><button class="btn pill" id="send">Send</button>
        <button class="btn secondary small" id="reject" title="The draft was wrong: send your text and record why">Send my own reply</button>
        <button class="btn secondary small" id="escalate">Escalate</button>
        <button class="btn ghost small" id="archive">Archive</button>
        <input class="why" id="why" placeholder="Reason (to reject or escalate)" aria-label="Reason">
        <input id="who" value="${esc(reviewer())}" aria-label="Your name" title="Your name, recorded with the review" style="max-width:130px">
      </div><div class="meta" id="note" style="padding:0 14px 10px"></div></div>`;
  }
  if (reviews.length) html += `<details class="gm-history"><summary>History (${reviews.length})</summary>` + reviews.map((r) => `<div class="meta">${esc(r.created_at)} · ${esc(r.outcome.replace("_", " "))} by ${esc(r.reviewer || "agent")}${r.reason ? ` · ${esc(r.reason)}` : ""}${r.spot_check ? " · picked for spot check" : ""}</div>`).join("") + `</details>`;
  v.innerHTML = head + `<div class="gm-thread">${html}</div>`;
  wireMoves(v, id);
  v.querySelectorAll("[data-redeliver]").forEach((b) => b.onclick = async () => {
    b.disabled = true;
    try { await api(`/api/gmail/deliver/${encodeURIComponent(b.dataset.redeliver)}`, { method: "POST" }); suite.toast("Sent from Gmail"); }
    catch (e) { suite.toast(e.message, 5000); }
    await loadEmails(false); openEmail(id);
  });
  if (done) return;

  const body = $("#body"), original = draft.body;
  const streak = await api("/api/autonomy").then((a) => a.categories.find((x) => x.kind === (c.topic || "other"))).catch(() => null);
  const hint = () => {
    const edited = body.value.trim() !== original.trim();
    $("#send").textContent = edited ? "Send edited" : "Send";
    const name = topic?.label || "Other";
    const typeOk = META.request_types.find((t) => t.id === c.category)?.auto_send !== false;
    $("#note").textContent = !streak || !streak.eligible ? `${name}: auto-send is switched off for this category (Settings).` :
      !typeOk ? `${CAT[c.category]} requests always need a person, so this one doesn't count towards ${name}.` :
      edited ? `Sending an edit resets ${name} to 0 of ${META.autonomy_threshold} unedited approvals.` : `Sending unchanged makes it ${streak.streak + 1} of ${META.autonomy_threshold} unedited approvals for ${name}.`;
  };
  body.oninput = hint; hint();
  const act = async (payload, msg) => {
    const who = $("#who").value.trim();
    if (!who) { $("#note").textContent = "Add your name first."; return; }
    saveReviewer(who);
    try {
      const r = await api(`/api/emails/${encodeURIComponent(id)}/review`, { method: "POST", body: JSON.stringify({ reviewer: who, ...payload }) });
      suite.toast(r.autonomy?.status === "autonomous" && streak?.status !== "autonomous" ? `${topic?.label || "Other"} reached ${META.autonomy_threshold}: its replies now send automatically` : msg, 4000);
      if (r.delivery_error) banner(`Saved, but Gmail didn't send it: ${r.delivery_error}`, "warn");
      await loadEmails(false); openEmail(id);
    } catch (e) { $("#note").textContent = e.message; }
  };
  const why = () => $("#why").value.trim();
  const need = (what) => { $("#note").textContent = what; $("#why").focus(); };
  $("#send").onclick = () => act({ action: "send", subject: $("#subj").value, body: body.value, ...(why() ? { reason: why() } : {}) }, body.value.trim() === original.trim() ? "Sent unchanged: counts towards auto-send" : "Sent with your edits: recorded as a correction");
  $("#reject").onclick = () => why() ? act({ action: "reject", subject: $("#subj").value, body: body.value, reason: why() }, "Sent your reply; the draft is marked wrong") : need("Say why the draft was wrong.");
  $("#escalate").onclick = () => why() ? act({ action: "escalate", reason: why() }, "Escalated") : need("Say why it needs escalating.");
  $("#archive").onclick = () => act({ action: "archive", ...(why() ? { reason: why() } : {}) }, "Archived");
}

function wireMoves(v, id) {
  v.querySelectorAll("[data-move]").forEach((b) => b.onclick = async () => {
    const to = b.dataset.move;
    try {
      const r = await api(`/api/emails/${encodeURIComponent(id)}/move`, { method: "POST", body: JSON.stringify({ to }) });
      suite.toast({ spam: "Moved to Spam", trash: "Moved to Trash: restore it from the Trash folder", back: "Moved back to the inbox" }[to] + (r.gmail_error ? ` (Gmail: ${r.gmail_error})` : ""), 3500);
      await loadEmails(false);
      if (to === "back") openEmail(id); else location.hash = lastList;
    } catch (e) { banner(e.message); }
  });
}

async function runProcess(id) {
  const btn = $("#process"); btn.disabled = true;
  const started = Date.now();
  const tick = () => { const s = Math.round((Date.now() - started) / 1000); btn.innerHTML = `<span class="spinner" style="border-top-color:currentColor"></span>Drafting… ${s} s`; $("#pmeta").textContent = s < 4 ? "Labelling the email…" : s < 9 ? "Asking the Knowledge Brain…" : "Writing and checking the reply…"; };
  tick(); const timer = setInterval(tick, 1000);
  try { const r = await api(`/api/emails/${encodeURIComponent(id)}/process`, { method: "POST" }); if (r.autoSent) suite.toast("Sent automatically: this label has earned auto-send", 4000); if (r.delivery_error) banner(`Gmail: ${r.delivery_error}`, "warn"); }
  catch (e) { banner(suite.friendlyError(e.message), e.status === 502 ? "warn" : "err"); }
  clearInterval(timer); window.dispatchEvent(new Event("suite:usage-changed"));
  await loadEmails(false); openEmail(id);
}

// ----- compose: writes a customer email into this inbox (until Gmail is connected)
function compose() {
  const old = $(".cw"); if (old) { old.classList.remove("min"); $("input", old).focus(); return; }
  const w = Object.assign(document.createElement("form"), { className: "cw" });
  w.setAttribute("aria-label", "New message");
  w.innerHTML = `<div class="cw-head">New message<button class="gm-tool" type="button" data-min title="Minimise" aria-label="Minimise" style="width:28px;height:28px">–</button><button class="gm-tool" type="button" data-x title="Close" aria-label="Close" style="width:28px;height:28px;margin-left:0">✕</button></div>
    <div class="hint">${gmail.connected ? "Test message: it lands in this inbox only (not in Gmail). To test with real mail, email " + esc(gmail.email) + " from another address, then Sync now." : "Write as a customer: the message lands in this inbox, like a real email arriving."}</div>
    <input name="name" placeholder="From (name)" required maxlength="80" value="Test Customer">
    <input name="email" type="email" placeholder="From (email)" required value="customer@example.com">
    <input name="subject" placeholder="Subject" maxlength="200">
    <textarea name="body" data-mic placeholder="e.g. How do I add a new membership plan to my site?" required maxlength="5000"></textarea>
    <div class="cw-foot"><button class="btn pill">Send to inbox</button><label><input type="checkbox" name="draft" ${draftingOn ? "checked" : "disabled"}> Draft a reply straight away</label><span class="meta" data-msg></span></div>`;
  document.body.append(w);
  $("[data-x]", w).onclick = () => w.remove();
  $("[data-min]", w).onclick = () => w.classList.toggle("min");
  $(".cw-head", w).ondblclick = () => w.classList.toggle("min");
  w.onsubmit = async (ev) => {
    ev.preventDefault();
    const f = w.elements, id = `C${Date.now().toString(36).toUpperCase()}`;
    try {
      await api("/api/emails", { method: "POST", body: JSON.stringify({ id, from: { name: f.name.value.trim(), email: f.email.value.trim() }, subject: f.subject.value.trim(), body: f.body.value }) });
      const draftNow = f.draft.checked; w.remove();
      await loadEmails(false);
      location.hash = `#/mail/${id}`;
      if (draftNow) setTimeout(() => $("#process")?.click(), 300);
    } catch (e) { $("[data-msg]", w).textContent = e.message; }
  };
  $("textarea", w).focus();
}

// ----- settings: X and which labels may auto-send, grouped by parent type
async function renderSettings() {
  const v = $("#view");
  const [s, a] = await Promise.all([api("/api/settings"), api("/api/autonomy")]).catch(() => [null, null]);
  if (!s) { v.innerHTML = `<div class="empty">Couldn't load settings.</div>`; return; }
  META = s;
  const st = new Map(a.categories.map((c) => [c.kind, c]));
  const [lo, hi] = s.threshold_range;
  let rows = s.topics.map((t) => ({ ...t }));
  const rowHtml = (t, i) => { const x = st.get(t.id) || { streak: 0, status: "supervised" };
    return `<div class="cat-row" data-i="${i}">
      <input data-f="label" value="${esc(t.label)}" maxlength="40" aria-label="Category name" placeholder="e.g. Header">
      <input data-f="parent" value="${esc(t.parent)}" maxlength="40" list="parent-list" aria-label="Parent setting type" placeholder="e.g. Design Settings">
      <input class="d" data-f="description" value="${esc(t.description)}" maxlength="300" aria-label="What belongs here (the classifier reads this)" placeholder="What belongs here: the classifier reads this">
      <div class="prog">${t.id ? `<span class="meta">${x.status === "autonomous" ? "<b style='color:var(--ok)'>Auto-sending</b>" : `${x.streak} of <span data-x>${s.autonomy_threshold}</span> unedited`}</span><div class="meter"><div style="width:${Math.min(100, (x.streak / s.autonomy_threshold) * 100)}%"></div></div>` : `<span class="meta">new</span>`}</div>
      <label class="switch" title="May this category auto-send?"><input type="checkbox" data-f="auto_send" ${t.auto_send !== false ? "checked" : ""} aria-label="Auto-send ${esc(t.label)}"><span></span></label>
      ${t.id === "other" ? "<span></span>" : `<button class="gm-tool" type="button" data-rm="${i}" title="Remove this category" aria-label="Remove ${esc(t.label)}" style="width:30px;height:30px">✕</button>`}</div>`; };
  const editor = () => {
    const parents = [...new Set(rows.map((t) => t.parent || "New"))];
    $("#cats").innerHTML = `<datalist id="parent-list">${[...new Set(rows.map((t) => t.parent))].map((p) => `<option value="${esc(p)}">`).join("")}</datalist>` +
      parents.map((p) => `<div class="set-group"><header><span class="ldot parent" style="--c:${parentColor(p)};border-radius:50%"></span><b>${esc(p)}</b><span class="meta">parent setting type</span></header>
        <div class="cat-row cat-head"><span>Category</span><span>Parent setting type</span><span class="d">What belongs here</span><span class="prog">Unedited in a row</span><span>Auto</span><span></span></div>
        ${rows.map((t, i) => (t.parent || "New") === p ? rowHtml(t, i) : "").join("")}</div>`).join("");
    $("#cats").querySelectorAll(".cat-row[data-i] input").forEach((inp) => inp.oninput = inp.onchange = () => {
      const t = rows[Number(inp.closest(".cat-row").dataset.i)];
      t[inp.dataset.f] = inp.type === "checkbox" ? inp.checked : inp.value;
    });
    $("#cats").querySelectorAll(".cat-row[data-i] input[data-f=parent]").forEach((inp) => inp.onchange = () => { rows[Number(inp.closest(".cat-row").dataset.i)].parent = inp.value; editor(); });
    $("#cats").querySelectorAll("[data-rm]").forEach((b) => b.onclick = () => {
      const t = rows[Number(b.dataset.rm)];
      if (t.id && !confirm(`Remove "${t.label}"? Its emails show as Other until they're drafted again; its streak is dropped.`)) return;
      rows.splice(Number(b.dataset.rm), 1); editor();
    });
  };
  v.innerHTML = `<div class="gm-page"><h2>Settings</h2>
    <p class="sub">${account ? `For <b>${esc(account)}</b>'s inbox. Other accounts keep their own settings.` : "For the shared guest inbox. Sign in with a demo account (top right) to change settings for your own inbox."}</p>
    <h3 class="label">Auto-send threshold</h3>
    <div class="set-x"><input type="number" id="x" min="${lo}" max="${hi}" value="${s.autonomy_threshold}" aria-label="Threshold X">
      <input type="range" id="xr" min="${lo}" max="${Math.min(hi, 50)}" value="${Math.min(s.autonomy_threshold, 50)}" aria-label="Threshold X slider">
      <div class="meta" style="flex-basis:100%">A category's replies send automatically once <b id="xv">${s.autonomy_threshold}</b> drafts in a row were sent without any change. Any edit, rejection, escalation or failed spot check resets that category to 0. Default ${s.default_threshold}. Critical, angry or suspicious emails always go to a person.</div></div>
    <h3 class="label">Email categories</h3>
    <p class="meta" style="margin:0">Which part of the site an email is about, under the parent setting type where it's managed. Rename, re-describe, move or remove them, or add your own: the agent sorts new emails into this list (it reads the descriptions). Each category earns auto-send on its own.</p>
    <div id="cats"></div>
    <div class="row"><button class="btn secondary small" id="add-cat" type="button">+ Add a category</button></div>
    <h3 class="label">Request types that need a person</h3>
    <p class="meta" style="margin:0 0 8px">Whatever the category, these kinds of request never send on their own while switched off (refunds, complaints, quotes...). They also decide what a reply must never say.</p>
    <div class="set-group">${s.request_types.map((l) => `<div class="cat-row" style="grid-template-columns:minmax(0,1fr) 90px 44px"><div><b>${esc(l.label)}</b><div class="meta" style="font-size:12px">${esc(l.definition)}</div></div>
      <span><span class="badge ${l.risk === "high" ? "err" : l.risk === "medium" ? "warn" : ""}">${esc(l.risk)} risk</span></span>
      <label class="switch" title="May this request type auto-send?"><input type="checkbox" data-type="${l.id}" ${l.auto_send ? "checked" : ""} aria-label="Auto-send ${esc(l.label)} requests"><span></span></label></div>`).join("")}</div>
    <div class="save-bar"><button class="btn" id="save">Save settings</button><span class="meta" id="smsg"></span></div></div>`;
  editor();
  $("#add-cat").onclick = () => { rows.push({ label: "", parent: rows.at(-2)?.parent || "Design Settings", description: "", auto_send: true }); editor(); $("#cats").querySelector(`.cat-row[data-i="${rows.length - 1}"] input`)?.focus(); };
  const x = $("#x"), xr = $("#xr");
  const sync = (val) => { $("#xv").textContent = val; v.querySelectorAll("[data-x]").forEach((el) => el.textContent = val); };
  x.oninput = () => { xr.value = Math.min(Number(x.value) || lo, 50); sync(x.value); };
  xr.oninput = () => { x.value = xr.value; sync(xr.value); };
  $("#save").onclick = async () => {
    const n = Number(x.value);
    if (!Number.isInteger(n) || n < lo || n > hi) { $("#smsg").textContent = `X must be a whole number from ${lo} to ${hi}.`; return; }
    const blank = rows.find((t) => !t.label.trim() || !t.parent.trim());
    if (blank) { $("#smsg").textContent = "Every category needs a name and a parent setting type."; return; }
    const auto_send = Object.fromEntries([...v.querySelectorAll("[data-type]")].map((c) => [c.dataset.type, c.checked]));
    const risky = s.request_types.filter((l) => auto_send[l.id] && !l.auto_send && l.risk === "high");
    if (risky.length && !confirm(`Allow auto-send for ${risky.map((l) => l.label).join(", ")} requests? These are high-risk: replies will go out without a person once a category reaches ${n} in a row.`)) return;
    try {
      const r = await api("/api/settings", { method: "PUT", body: JSON.stringify({ autonomy_threshold: n, auto_send, topics: rows, actor: reviewer() }) });
      const g = r.events.filter((e) => e.event === "granted").length, k = r.events.filter((e) => e.event === "revoked").length;
      suite.toast(`Saved.${g ? ` ${g} categor${g === 1 ? "y" : "ies"} now auto-send.` : ""}${k ? ` ${k} back under review.` : ""}`, 4000);
      await loadEmails(false); renderSettings();
    } catch (e) { $("#smsg").textContent = e.message; }
  };
}

  v.querySelectorAll("#learning [data-act]").forEach((b) => b.onclick = async () => {
    const card = b.closest("[data-cat]"); const cat = card.dataset.cat; const note = $("[data-note]", card);
    const who = reviewer(); saveReviewer(who);
    const act = b.dataset.act; const ver = b.dataset.v;
    const body = { actor: who };
    if (act === "reject" || act === "rollback") { const r = prompt(act === "reject" ? "Why reject these lessons?" : "Why roll back?"); if (!r) return; body.note = r; }
    if (act === "promote") {
      const cand = (await api("/api/learning")).categories.find((c) => c.category === cat).versions.find((x) => x.version === Number(ver));
      if (!cand.evaluation?.recommended) { const r = prompt("The check did not recommend these lessons. Why make them live anyway?"); if (!r) return; body.note = r; }
    }
    const path = act === "propose" || act === "rollback" ? `/api/learning/${cat}/${act}` : `/api/learning/${cat}/${ver}/${act}`;
    b.disabled = true; note.textContent = act === "evaluate" ? "Re-drafting past emails with and without the lessons…" : "";
    try { await api(path, { method: "POST", body: JSON.stringify(body) }); renderLearning(); }
    catch (e) { note.textContent = e.message; b.disabled = false; }
  });
}

// ----- start
async function loadEmails(rerender = true) {
  const r = await api("/api/emails").catch(() => null);
  if (!r) return;
  emails = r;
  if (rerender) render(); else renderSide(route());
}
$("#compose-btn").onclick = compose;
$("#menu").onclick = () => $("#gm").classList.toggle("side-open");
$("#reload").onclick = () => loadEmails();
let qTimer; $("#q").oninput = () => { clearTimeout(qTimer); qTimer = setTimeout(() => { const r = route(); if (r.kind === "mail" || !["folder", "label", "parent"].includes(r.kind)) location.hash = "#/folder/all"; else renderList(r); }, 150); };
document.addEventListener("keydown", (e) => {
  if (e.target.closest("input, textarea, select, [contenteditable]")) return;
  if (e.key === "c" && !e.ctrlKey && !e.metaKey) { e.preventDefault(); compose(); }
  if (e.key === "/") { e.preventDefault(); $("#q").focus(); }
});

(async () => {
  const [h, s, sess] = await Promise.all([api("/health").catch(() => null), api("/api/settings").catch(() => null), api("/api/session").catch(() => null)]);
  draftingOn = Boolean(h?.drafting_enabled);
  if (s) META = s;
  account = sess && sess.workspace !== "guest" ? sess.workspace : null;
  $("#s-right").innerHTML = h ? `<span class="badge ${draftingOn ? "ok" : "warn"}">${draftingOn ? "Drafting on" : "Drafting off"}</span>` : "";
  if (h && !draftingOn) banner("Drafting is off until Claude on Amazon Bedrock is configured (AWS_REGION and AWS credentials). You can still browse the inbox.", "info");
  await Promise.all([loadGmail(), loadEmails()]);
  // A connected Gmail inbox fills in the background: refresh the list now and then.
  setInterval(() => { if (gmail.connected && document.visibilityState === "visible") { loadGmail(); loadEmails(route().kind !== "mail"); } }, 60_000);
})();
</script>
