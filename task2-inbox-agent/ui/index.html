<title>Inbox Agent</title>
<!-- suite:css -->
<style>
/* Shared look for the three services and the hub page. Edit here, then run
   python scripts/sync_suite.py   (copies this into each page between suite markers). */
:root {
  --bg: #f5f6f8; --panel: #ffffff; --panel-2: #f0f2f5; --text: #15171c; --muted: #5d6470;
  --line: #e2e5ea; --line-strong: #cfd4dc; --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 2px 8px rgba(16, 24, 40, .04);
  --ok-bg: #e3f5ea; --ok: #17663a; --warn-bg: #fdf0d8; --warn: #7d5200;
  --info-bg: #e7edfd; --info: #2747a3; --err-bg: #fde6e4; --err: #a3231a;
  --kb: #0e8a7a; --inbox: #4c55d4; --scope: #b8600f;
  --radius: 12px; --radius-sm: 8px;
  color-scheme: light;
}
/* Dark: follows the system unless the toggle chose a theme (data-theme on <html>). */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0c0f; --panel: #161b22; --panel-2: #1f262f; --text: #eef1f4; --muted: #aab2be;
    --line: #2d3540; --line-strong: #46505e; --shadow: 0 0 0 1px rgba(255, 255, 255, .025), 0 8px 24px rgba(0, 0, 0, .55);
    --ok-bg: #12301f; --ok: #86d9a6; --warn-bg: #362810; --warn: #f2c56b;
    --info-bg: #19244a; --info: #a9bbff; --err-bg: #3b1714; --err: #ff9f94;
    --kb: #3cc9b4; --inbox: #8d96ff; --scope: #f3a75c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a0c0f; --panel: #161b22; --panel-2: #1f262f; --text: #eef1f4; --muted: #aab2be;
  --line: #2d3540; --line-strong: #46505e; --shadow: 0 0 0 1px rgba(255, 255, 255, .025), 0 8px 24px rgba(0, 0, 0, .55);
  --ok-bg: #12301f; --ok: #86d9a6; --warn-bg: #362810; --warn: #f2c56b;
  --info-bg: #19244a; --info: #a9bbff; --err-bg: #3b1714; --err: #ff9f94;
  --kb: #3cc9b4; --inbox: #8d96ff; --scope: #f3a75c;
  color-scheme: dark;
}
body[data-app="kb"] { --accent: var(--kb); }
body[data-app="inbox"] { --accent: var(--inbox); }
body[data-app="scope"] { --accent: var(--scope); }
body[data-app="hub"] { --accent: var(--inbox); }
:root { --accent: var(--inbox); }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text);
       font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
a { color: var(--accent); }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

/* Suite bar: the same on every page */
.s-bar { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--panel) 88%, transparent);
         backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.s-bar-in { max-width: 1320px; margin: 0 auto; padding: 0 16px; height: 56px; display: flex; align-items: center; gap: 14px; }
.s-brand { display: flex; align-items: center; gap: 9px; font-weight: 700; color: var(--text); text-decoration: none; white-space: nowrap; }
.s-apps { display: flex; gap: 4px; margin-left: 8px; overflow-x: auto; scrollbar-width: none; }
.s-app { display: flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: 999px; color: var(--muted);
         text-decoration: none; font-weight: 550; font-size: 14px; white-space: nowrap; }
.s-app:hover { background: var(--panel-2); color: var(--text); }
.s-app[aria-current="page"] { background: var(--panel-2); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
.s-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.s-app[data-suite-link="kb"] .s-dot { background: var(--kb); }
.s-app[data-suite-link="inbox"] .s-dot { background: var(--inbox); }
.s-app[data-suite-link="scope"] .s-dot { background: var(--scope); }
.s-task { color: var(--muted); font-weight: 500; font-size: 12px; }
.s-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
@media (max-width: 760px) { .s-brand span, .s-task { display: none; } .s-apps { margin-left: 0; } }

/* App sub-header: title + sub-tabs */
.app-head { max-width: 1320px; margin: 0 auto; padding: 18px 16px 0; display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.app-title { margin: 0; font-size: 22px; letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; }
.app-title::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.app-sub { color: var(--muted); margin: 2px 0 0; font-size: 14px; }
.subtabs { display: flex; gap: 2px; margin-left: auto; background: var(--panel-2); padding: 3px; border-radius: 10px; border: 1px solid var(--line); }
.subtabs button { background: none; border: 0; padding: 6px 14px; border-radius: 8px; color: var(--muted); font: inherit; font-size: 14px; font-weight: 550; cursor: pointer; display: flex; gap: 6px; align-items: center; }
.subtabs button[aria-selected="true"] { background: var(--panel); color: var(--text); box-shadow: var(--shadow); }
.wrap { max-width: 1320px; margin: 0 auto; padding: 16px; }

/* Building blocks */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
.panel + .panel { margin-top: 16px; }
/* ...but not when panels sit side by side in a grid (that offset the hub cards and the inbox). */
.grid3 > .panel, .layout > .panel, .layout > * > .panel:first-child, .ask-grid > .panel { margin-top: 0; }
.panel.flush { padding: 0; }
h2 { font-size: 17px; margin: 0 0 4px; letter-spacing: -.005em; }
h3.label { font-size: 12px; margin: 20px 0 8px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 650; }
.muted, .meta { color: var(--muted); }
.meta { font-size: 13px; }
.sub { color: var(--muted); margin: 0 0 14px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
.spacer { flex: 1; }
input, textarea, select { width: 100%; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line-strong);
                          border-radius: var(--radius-sm); padding: 9px 12px; }
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
textarea { resize: vertical; }
.btn { display: inline-flex; align-items: center; gap: 8px; background: var(--accent); color: #fff; border: 0; border-radius: var(--radius-sm);
       padding: 9px 16px; font: inherit; font-weight: 650; cursor: pointer; text-decoration: none; white-space: nowrap; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn:not(.secondary):not(.ghost) { color: #0d0f12; } }
:root[data-theme="dark"] .btn:not(.secondary):not(.ghost) { color: #0d0f12; }
.btn:hover { filter: brightness(1.06); }
.btn.secondary { background: var(--panel); color: var(--text); border: 1px solid var(--line-strong); }
.btn.secondary:hover { background: var(--panel-2); filter: none; }
.btn.ghost { background: none; color: var(--muted); padding: 6px 10px; }
.btn.ghost:hover { color: var(--text); background: var(--panel-2); filter: none; }
.btn.small { padding: 6px 12px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: not-allowed; filter: none; }
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 650;
         background: var(--panel-2); color: var(--muted); white-space: nowrap; border: 1px solid transparent; }
.badge.ok { background: var(--ok-bg); color: var(--ok); } .badge.warn { background: var(--warn-bg); color: var(--warn); }
.badge.info { background: var(--info-bg); color: var(--info); } .badge.err { background: var(--err-bg); color: var(--err); }
.badge.accent { background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent); }
.chip { display: inline-flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; background: var(--panel);
        border: 1px solid var(--line-strong); border-radius: 10px; padding: 8px 12px; font: inherit; font-size: 14px; color: var(--text); cursor: pointer; }
.chip small { color: var(--muted); font-size: 12px; }
.chip:hover { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 6%, var(--panel)); }
.banner { padding: 10px 14px; border-radius: 10px; margin-bottom: 12px; display: flex; gap: 10px; align-items: flex-start; }
.banner.err { background: var(--err-bg); color: var(--err); } .banner.info { background: var(--info-bg); color: var(--info); }
.banner.ok { background: var(--ok-bg); color: var(--ok); } .banner.warn { background: var(--warn-bg); color: var(--warn); }
.empty { color: var(--muted); text-align: center; padding: 32px 20px; }
.steps { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; counter-reset: s; }
.steps li { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; counter-increment: s; }
.steps li::before { content: counter(s); width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700;
                    background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent); }
.kbd { font: 12px ui-monospace, Consolas, monospace; padding: 1px 6px; border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 5px; color: var(--muted); }
.spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--accent) 25%, transparent);
           border-top-color: var(--accent); animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; vertical-align: top; padding: 10px; border-bottom: 1px solid var(--line); font-size: 14px; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 650; }
.table-wrap { overflow-x: auto; }
.md p { margin: 0 0 10px; } .md ol, .md ul { margin: 0 0 10px; padding-left: 22px; } .md li { margin: 3px 0; }
.lightbox { position: fixed; inset: 0; z-index: 50; background: rgba(5, 7, 10, .82); display: grid; place-items: center; padding: 24px; cursor: zoom-out; }
.lightbox img { max-width: 100%; max-height: 100%; border-radius: 10px; box-shadow: 0 10px 40px rgba(0, 0, 0, .5); background: #fff; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 60; background: var(--text); color: var(--bg);
         padding: 10px 16px; border-radius: 10px; font-weight: 600; box-shadow: 0 6px 24px rgba(0, 0, 0, .25); max-width: calc(100% - 32px); }

/* Theme toggle and other icon buttons in the bar */
.s-icon { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); cursor: pointer; }
.s-icon:hover { color: var(--text); background: var(--panel-2); }
.s-icon svg { width: 17px; height: 17px; }
.s-icon .sun { display: none; }
:root[data-theme="dark"] .s-icon .sun { display: block; } :root[data-theme="dark"] .s-icon .moon { display: none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .s-icon .sun { display: block; } :root:not([data-theme="light"]) .s-icon .moon { display: none; } }

/* Voice input: a mic button inside any field marked data-mic */
.mic-wrap { position: relative; }
.mic-wrap > textarea { padding-right: 48px; }
.mic-wrap > input { padding-right: 44px; }
.mic-btn { position: absolute; right: 8px; bottom: 8px; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line-strong);
           background: var(--panel); color: var(--muted); display: grid; place-items: center; cursor: pointer; }
.mic-wrap > input + .mic-btn { top: 50%; bottom: auto; transform: translateY(-50%); width: 28px; height: 28px; }
.mic-btn:hover { color: var(--text); border-color: var(--accent); }
.mic-btn svg { width: 16px; height: 16px; }
.mic-btn.busy { cursor: progress; border-color: var(--accent); }
.mic-btn .spinner { width: 14px; height: 14px; }
.mic-btn.on { background: var(--err); border-color: var(--err); color: #fff; animation: micpulse 1.4s ease-out infinite; }
@keyframes micpulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--err) 55%, transparent); } 100% { box-shadow: 0 0 0 10px transparent; } }
@media (prefers-reduced-motion: reduce) { .mic-btn.on { animation: none; } }

/* Footer links on every page */
.s-foot { max-width: 1320px; margin: 8px auto 28px; padding: 0 16px; display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 13px; }
.s-foot a { color: var(--muted); } .s-foot a:hover { color: var(--text); }

/* Usage bar fixed to the bottom of every page */
body.has-usage-bar { padding-bottom: 46px; }
.usage-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; border-top: 1px solid var(--line-strong);
             background: color-mix(in srgb, var(--panel) 94%, transparent); backdrop-filter: blur(10px); font-size: 13px;
             box-shadow: 0 -4px 18px rgba(0, 0, 0, .12); }
.ub-in { max-width: 1320px; margin: 0 auto; padding: 8px 16px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; min-height: 38px; }
.ub-state { display: inline-flex; align-items: center; gap: 7px; font-weight: 650; }
.ub-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); }
.usage-bar.near .ub-dot { background: var(--warn); box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn) 25%, transparent); }
.usage-bar.paused { background: color-mix(in srgb, var(--err-bg) 92%, transparent); border-top-color: var(--err); }
.usage-bar.paused .ub-state { color: var(--err); }
.usage-bar.paused .ub-dot { background: var(--err); box-shadow: 0 0 0 3px color-mix(in srgb, var(--err) 25%, transparent); }
.ub-sep { width: 1px; height: 16px; background: var(--line-strong); }
.ub-meter { width: 110px; height: 7px; border-radius: 4px; background: var(--panel-2); overflow: hidden; border: 1px solid var(--line); }
.ub-meter > span { display: block; height: 100%; background: var(--ok); }
.usage-bar.near .ub-meter > span { background: var(--warn); }
.ub-meta { margin-left: auto; color: var(--muted); cursor: help; }
@media (max-width: 760px) { .ub-sep, .ub-meter { display: none; } .ub-meta { margin-left: 0; } body.has-usage-bar { padding-bottom: 76px; } }
.toast { bottom: 62px; }

/* Clickables that must stand out in dark mode */
.btn.secondary, .chip, .vbtn, .s-icon { box-shadow: 0 1px 0 rgba(255, 255, 255, .04) inset, 0 1px 2px rgba(0, 0, 0, .12); }
.btn:not(.ghost):not(:disabled):hover, .chip:hover, .vbtn:hover { transform: translateY(-1px); }
.btn, .chip, .vbtn { transition: transform .12s ease, background-color .12s ease, border-color .12s ease; }
@media (prefers-reduced-motion: reduce) { .btn, .chip, .vbtn { transition: none; } .btn:hover, .chip:hover, .vbtn:hover { transform: none; } }
:root[data-theme="dark"] .btn.secondary, :root[data-theme="dark"] .chip, :root[data-theme="dark"] .vbtn { background: var(--panel-2); border-color: var(--line-strong); }
:root[data-theme="dark"] .btn.secondary:hover, :root[data-theme="dark"] .chip:hover, :root[data-theme="dark"] .vbtn:hover { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--panel-2)); }
:root[data-theme="dark"] input, :root[data-theme="dark"] textarea, :root[data-theme="dark"] select { background: #0f1318; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .btn.secondary, :root:not([data-theme="light"]) .chip, :root:not([data-theme="light"]) .vbtn { background: var(--panel-2); border-color: var(--line-strong); }
  :root:not([data-theme="light"]) .btn.secondary:hover, :root:not([data-theme="light"]) .chip:hover, :root:not([data-theme="light"]) .vbtn:hover { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--panel-2)); }
  :root:not([data-theme="light"]) input, :root:not([data-theme="light"]) textarea, :root:not([data-theme="light"]) select { background: #0f1318; }
}

/* Demo accounts: the account chip in the bar and the sign-in dialog */
.s-acct { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--panel); color: var(--text); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.s-acct:hover { border-color: var(--accent); }
.s-acct .who { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: #fff; background: var(--accent); }
.s-acct.guest .who { background: var(--muted); }
.s-modal { position: fixed; inset: 0; z-index: 70; background: rgba(5, 7, 10, .55); display: grid; place-items: center; padding: 16px; }
.s-modal-box { width: min(440px, 100%); background: var(--panel); border: 1px solid var(--line-strong); border-radius: 14px; padding: 22px; box-shadow: 0 20px 60px rgba(0, 0, 0, .35); }
.s-modal-box h2 { margin: 0 0 6px; }
.s-accts { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; margin: 12px 0 14px; }
.s-accts button { text-align: left; border: 1px solid var(--line-strong); background: var(--bg); color: var(--text); border-radius: 10px; padding: 8px 10px; font: inherit; font-size: 13px; cursor: pointer; }
.s-accts button:hover, .s-accts button[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--bg)); }
.s-accts small { display: block; color: var(--muted); font: 12px ui-monospace, Consolas, monospace; }
.s-modal-box form { display: grid; gap: 8px; }
</style>

<style>
  /* Gmail-like layout: folders and labels on the left, the mail list or a thread on the right. */
  :root { --p-support: #1a73e8; --p-account: #a15c00; --p-sales: #188038; --p-care: #c5221f; --p-other: #5f6368; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --p-support: #8ab4f8; --p-account: #fdd663; --p-sales: #81c995; --p-care: #f28b82; --p-other: #9aa0a6; } }
  :root[data-theme="dark"] { --p-support: #8ab4f8; --p-account: #fdd663; --p-sales: #81c995; --p-care: #f28b82; --p-other: #9aa0a6; }

  .gm { max-width: 1480px; margin: 0 auto; padding: 10px 16px 0 8px; display: grid; grid-template-columns: 248px minmax(0, 1fr); gap: 8px;
        height: calc(100vh - 56px - 46px - 12px); min-height: 520px; }
  .gm-side { overflow: auto; padding-bottom: 16px; scrollbar-width: thin; }
  .gm-compose { display: inline-flex; align-items: center; gap: 12px; padding: 16px 24px 16px 18px; border-radius: 16px; border: 0; cursor: pointer;
                background: color-mix(in srgb, var(--accent) 20%, var(--panel)); color: var(--text); font: inherit; font-weight: 600; margin: 0 0 14px 8px; box-shadow: var(--shadow); }
  .gm-compose:hover { box-shadow: 0 2px 6px rgba(0, 0, 0, .2); }
  .gm-compose svg { width: 22px; height: 22px; }
  .gm-nav a, .gm-nav button { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 32px; padding: 0 14px 0 20px; border: 0; background: none;
               border-radius: 0 16px 16px 0; color: var(--text); text-decoration: none; font: inherit; font-size: 14px; cursor: pointer; text-align: left; }
  .gm-nav a:hover, .gm-nav button:hover { background: var(--panel-2); }
  .gm-nav a[aria-current="page"], .gm-nav button[aria-current="page"] { background: color-mix(in srgb, var(--accent) 22%, var(--panel)); font-weight: 700; }
  .gm-nav .n { margin-left: auto; font-size: 12px; font-weight: 650; }
  .gm-nav svg { width: 18px; height: 18px; flex: none; color: var(--muted); }
  .gm-nav a[aria-current="page"] svg { color: var(--text); }
  .gm-sec { display: flex; align-items: center; justify-content: space-between; padding: 16px 14px 4px 20px; font-size: 14px; font-weight: 600; }
  .gm-sec a { color: var(--muted); font-size: 12px; font-weight: 500; }
  .gm-parent { font-weight: 600; }
  .gm-parent .caret { width: 14px; transition: transform .15s; }
  .gm-parent[aria-expanded="false"] .caret { transform: rotate(-90deg); }
  .gm-nav .child { padding-left: 46px; }
  .ldot { width: 11px; height: 11px; border-radius: 3px; background: var(--c); flex: none; }
  .gm-nav .ldot.parent { border-radius: 50%; }

  .gm-main { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; display: flex; flex-direction: column; min-width: 0; overflow: hidden; box-shadow: var(--shadow); }
  .gm-top { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  .gm-search { flex: 1; max-width: 720px; position: relative; }
  .gm-search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); }
  .gm-search input { border-radius: 999px; background: var(--panel-2); border-color: transparent; padding: 10px 16px 10px 44px; }
  .gm-search input:focus { background: var(--panel); }
  .gm-tool { border: 0; background: none; color: var(--muted); width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; flex: none; }
  .gm-tool:hover { background: var(--panel-2); color: var(--text); }
  .gm-tool svg { width: 20px; height: 20px; }
  .gm-menu { display: none; }
  .gm-head { display: flex; gap: 10px; align-items: center; padding: 10px 16px 8px; font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .gm-head h2 { color: var(--text); font-size: 16px; margin: 0; display: flex; gap: 8px; align-items: center; }
  .gm-body { flex: 1; overflow: auto; }

  .gm-row { display: grid; grid-template-columns: 16px 200px minmax(0, 1fr) auto 64px; grid-template-areas: "imp from mid st date"; gap: 12px; align-items: center;
            padding: 0 16px; min-height: 42px; border-bottom: 1px solid var(--line); color: var(--text); text-decoration: none; font-size: 14px;
            background: color-mix(in srgb, var(--panel-2) 45%, var(--panel)); }
  .gm-row:hover { box-shadow: inset 1px 0 0 var(--line-strong), inset -1px 0 0 var(--line-strong), 0 1px 4px rgba(0, 0, 0, .14); position: relative; z-index: 1; }
  .gm-row.unread { background: var(--panel); }
  .gm-row.unread .from, .gm-row.unread .subj, .gm-row.unread .date { font-weight: 700; }
  .gm-row .imp { grid-area: imp; width: 12px; height: 12px; }
  .gm-row .imp.critical { color: var(--err); } .gm-row .imp.high { color: var(--warn); }
  .gm-row .from { grid-area: from; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gm-row .mid { grid-area: mid; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gm-row .snip { color: var(--muted); }
  .gm-row .st { grid-area: st; }
  .gm-row .date { grid-area: date; text-align: right; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .gm-row.unread .date { color: var(--text); }
  .lbl { display: inline-block; padding: 0 6px; border-radius: 4px; font-size: 12px; font-weight: 600; line-height: 19px; vertical-align: 1px; margin-right: 6px;
         background: color-mix(in srgb, var(--c) 15%, transparent); color: var(--c); white-space: nowrap; text-decoration: none; }
  a.lbl:hover { background: color-mix(in srgb, var(--c) 25%, transparent); }
  .st { font-size: 12px; font-weight: 650; display: inline-flex; gap: 5px; align-items: center; color: var(--muted); white-space: nowrap; }
  .st::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .st.new { color: var(--info); } .st.drafted { color: var(--warn); } .st.sent, .st.archived { color: var(--ok); } .st.escalated { color: var(--accent); } .st.failed { color: var(--err); }
  .tip { margin: 12px 16px; padding: 12px 14px; border-radius: 12px; background: color-mix(in srgb, var(--accent) 8%, var(--panel)); border: 1px solid var(--line); }
  .tip .try { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }

  /* A thread */
  .gm-thread { padding: 8px 24px 40px; max-width: 1040px; }
  .gm-subject { font-size: 22px; font-weight: 450; margin: 6px 0 4px 52px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .msg { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; padding: 16px 0; border-bottom: 1px solid var(--line); }
  .av { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 650; font-size: 16px; }
  .msg-head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .msg-head .meta { font-size: 12px; }
  .msg-head .when { margin-left: auto; }
  .msg-body { white-space: pre-wrap; margin-top: 10px; overflow-wrap: anywhere; }
  .msg.earlier .msg-body { color: var(--muted); }
  .assist { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin: 16px 0 16px 52px; background: color-mix(in srgb, var(--accent) 5%, var(--panel)); }
  .assist h3 { margin: 0 0 8px; font-size: 14px; display: flex; gap: 8px; align-items: center; }
  .assist h3 svg { width: 18px; height: 18px; color: var(--accent); }
  .ev { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-top: 8px; background: var(--panel); }
  .flag { padding: 8px 12px; border-radius: 9px; margin-top: 6px; font-size: 14px; }
  .flag.block { background: var(--err-bg); color: var(--err); } .flag.warn { background: var(--warn-bg); color: var(--warn); } .flag.info { background: var(--info-bg); color: var(--info); }
  .reply { border: 1px solid var(--line-strong); border-radius: 12px; box-shadow: var(--shadow); margin-left: 52px; background: var(--panel); }
  .reply-to { padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .reply input.subj { border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: transparent; padding: 10px 14px; }
  .reply textarea { border: 0; border-radius: 0; background: transparent; min-height: 230px; padding: 12px 14px; }
  .reply input.subj:focus, .reply textarea:focus { box-shadow: none; }
  .reply-foot { padding: 10px 14px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; border-top: 1px solid var(--line); }
  .reply-foot input { width: auto; padding: 7px 10px; font-size: 14px; }
  .reply-foot .why { flex: 1; min-width: 180px; }
  .btn.pill { border-radius: 999px; padding: 9px 22px; }
  .gm-history { margin: 16px 0 0 52px; }
  details summary { cursor: pointer; color: var(--muted); font-size: 13px; }

  /* Compose: a window docked bottom right, like Gmail's */
  .cw { position: fixed; right: 24px; bottom: 46px; width: min(540px, calc(100vw - 24px)); background: var(--panel); border: 1px solid var(--line-strong); z-index: 55;
        border-radius: 12px 12px 0 0; box-shadow: 0 8px 32px rgba(0, 0, 0, .32); display: flex; flex-direction: column; }
  .cw-head { background: var(--panel-2); padding: 10px 10px 10px 16px; font-weight: 600; font-size: 14px; display: flex; align-items: center; border-radius: 12px 12px 0 0; }
  .cw-head button { margin-left: auto; }
  .cw .hint { padding: 8px 16px 0; font-size: 12px; color: var(--muted); }
  .cw input, .cw textarea { border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: transparent; padding: 9px 16px; }
  .cw input:focus, .cw textarea:focus { box-shadow: none; border-color: var(--accent); }
  .cw textarea { min-height: 220px; border-bottom: 0; }
  .cw-foot { display: flex; gap: 12px; padding: 10px 16px 14px; align-items: center; flex-wrap: wrap; font-size: 13px; }
  .cw-foot label { display: flex; gap: 6px; align-items: center; color: var(--muted); }
  .cw-foot input[type="checkbox"] { width: auto; }
  .cw.min textarea, .cw.min input, .cw.min .hint, .cw.min .cw-foot { display: none; }

  /* Settings, autonomy, learning pages */
  .gm-page { padding: 18px 24px 40px; max-width: 1040px; }
  .gm-page h2 { font-size: 20px; font-weight: 500; margin-bottom: 4px; }
  .set-x { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; margin: 14px 0 6px; }
  .set-x input[type="number"] { width: 90px; font-size: 20px; font-weight: 650; text-align: center; }
  .set-x input[type="range"] { flex: 1; min-width: 160px; padding: 0; accent-color: var(--accent); }
  .set-group { border: 1px solid var(--line); border-radius: 12px; margin-top: 14px; overflow: hidden; }
  .set-group > header { display: flex; gap: 10px; align-items: center; padding: 10px 16px; background: var(--panel-2); }
  .set-group > header .meta { margin-left: auto; }
  .set-row { display: grid; grid-template-columns: minmax(0, 1fr) 90px 170px 60px; gap: 14px; align-items: center; padding: 10px 16px; border-top: 1px solid var(--line); }
  .set-row .def { font-size: 12px; color: var(--muted); }
  .meter { height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; margin-top: 4px; }
  .meter > div { height: 100%; background: var(--accent); }
  .switch { position: relative; width: 38px; height: 22px; flex: none; justify-self: end; }
  .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; width: 100%; height: 100%; padding: 0; }
  .switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--line-strong); transition: background .15s; }
  .switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0, 0, 0, .3); }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(16px); }
  .switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  .save-bar { position: sticky; bottom: 0; background: var(--panel); padding: 12px 0; display: flex; gap: 10px; align-items: center; border-top: 1px solid var(--line); margin-top: 16px; }

  .gbox { margin: 0 10px 12px 8px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; font-size: 13px; }
  .gbox .who { font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; gap: 6px; align-items: center; }
  .gbox .who::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
  .gbox .who.err::before { background: var(--err); }
  .gbox .row { margin-top: 8px; }
  .gbtn { display: inline-flex; align-items: center; gap: 8px; width: 100%; justify-content: center; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line-strong);
          background: var(--panel); color: var(--text); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none; }
  .gbtn:hover { background: var(--panel-2); }
  .gbtn svg { width: 16px; height: 16px; }
  @media (max-width: 900px) {
    .gm { grid-template-columns: 1fr; height: auto; min-height: 0; padding: 8px 8px 0; }
    .gm-side { display: none; position: fixed; inset: 56px auto 46px 0; width: 270px; z-index: 40; background: var(--panel); border-right: 1px solid var(--line); box-shadow: 0 0 30px rgba(0, 0, 0, .3); padding-top: 12px; }
    .gm.side-open .gm-side { display: block; }
    .gm-menu { display: grid; }
    .gm-main { min-height: calc(100vh - 56px - 46px - 16px); }
    .gm-row { grid-template-columns: 12px minmax(0, 1fr) auto; grid-template-areas: "imp from date" ". mid mid" ". st st"; gap: 2px 10px; padding: 10px 12px; }
    .gm-row .st:empty { display: none; }
    .gm-thread, .gm-page { padding: 8px 12px 32px; }
    .gm-subject, .assist, .reply, .gm-history { margin-left: 0; }
    .msg { grid-template-columns: 32px minmax(0, 1fr); } .av { width: 32px; height: 32px; font-size: 14px; }
    .set-row { grid-template-columns: minmax(0, 1fr) auto; } .set-row .prog { grid-column: 1 / -1; } .set-row .risk { display: none; }
    .cw { right: 12px; }
  }
</style>
</head>

<script>
// Shared behaviour for the suite bar. Edit here, then run  python scripts/sync_suite.py
// Links between the three services work both locally (ports 8001-8003) and deployed
// (kb. / inbox. / scope. subdomains of one host, with the hub page on the bare host).
(function () {
  const ports = { kb: 8001, inbox: 8002, scope: 8003 };
  const { protocol, hostname } = location;
  const sub = hostname.match(/^(kb|inbox|scope)\.(.+)$/);
  const base = sub ? sub[2] : hostname;
  const deployed = !location.port && !/^(localhost|127\.0\.0\.1|\[::1\])$/.test(hostname);
  const urlFor = (app) => deployed ? `${protocol}//${app}.${base}/` : `${protocol}//${hostname}:${ports[app]}/`;
  const current = document.body.dataset.app;
  document.querySelectorAll("[data-suite-link]").forEach((a) => {
    a.href = urlFor(a.dataset.suiteLink);
    if (a.dataset.suiteLink === current) a.setAttribute("aria-current", "page");
  });
  const home = document.querySelector("[data-suite-home]");
  if (home) home.href = deployed ? `${protocol}//${base}/` : urlFor("kb");

  // Light / dark toggle. The choice is shared by all three services: a cookie on the
  // parent host when deployed (subdomains share it), localStorage as a fallback.
  const root = document.documentElement;
  const effective = () => root.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const themeBtn = document.getElementById("s-theme");
  if (themeBtn) themeBtn.onclick = () => {
    const next = effective() === "dark" ? "light" : "dark";
    root.dataset.theme = next;
    try { localStorage.setItem("theme", next); } catch {}
    document.cookie = `theme=${next}; path=/; max-age=31536000; SameSite=Lax${deployed ? `; domain=${base}` : ""}`;
  };

  // Demo accounts. Signing in is optional: guests share one workspace; a demo account keeps
  // its own inbox and scope projects across visits. Deployed only (the proxy routes /_auth).
  const acctSlot = document.getElementById("s-account");
  async function accountWidget() {
    if (!acctSlot || !deployed) return;
    let me;
    try { me = await fetch("/_auth/me").then((r) => r.ok ? r.json() : null); } catch { return; }
    if (!me) return;
    // A Google login (Connect Gmail) is named by a hash; show its address instead.
    const who = me.account?.startsWith("g_") ? decodeURIComponent((document.cookie.match(/(?:^|; )bl_who=([^;]*)/) || [])[1] || "Gmail account") : me.account;
    const initial = (who || "g").replace(/^demo/, "")[0].toUpperCase();
    const safe = String(who).replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
    acctSlot.innerHTML = me.account
      ? `<button class="s-acct" type="button" title="Signed in as ${safe}: your own inbox and projects. Click to sign out."><span class="who">${initial}</span>${safe}</button>`
      : `<button class="s-acct guest" type="button" title="You're in the shared guest workspace. Sign in with a demo account to keep your own work."><span class="who">G</span>Guest · Sign in</button>`;
    acctSlot.querySelector("button").onclick = me.account ? signOut : () => signInDialog(me.demo_accounts);
  }
  async function signOut() {
    if (!confirm("Sign out? Your work stays saved in this demo account for next time.")) return;
    await fetch("/_auth/logout", { method: "POST" }).catch(() => null);
    location.reload();
  }
  function signInDialog(accounts) {
    const wrap = Object.assign(document.createElement("div"), { className: "s-modal" });
    wrap.innerHTML = `<div class="s-modal-box" role="dialog" aria-modal="true" aria-labelledby="s-si-title">
      <h2 id="s-si-title">Sign in with a demo account</h2>
      <p class="meta" style="margin:0">Your inbox, drafts, learning and scope projects are saved to the account, so you can come back and pick up where you left off. Without signing in you share the guest workspace.</p>
      <div class="s-accts">${accounts.map((a) => `<button type="button" data-a="${a.account}" data-p="${a.password}">${a.account}<small>${a.password}</small></button>`).join("")}</div>
      <form><input name="account" placeholder="Account, e.g. demo1" autocomplete="username" required>
        <input name="password" type="password" placeholder="Password" autocomplete="current-password" required>
        <div class="row" style="margin-top:4px"><button class="btn">Sign in</button><button class="btn ghost" type="button" data-close>Cancel</button><span class="meta" data-msg></span></div></form></div>`;
    document.body.append(wrap);
    const form = wrap.querySelector("form");
    const close = () => { wrap.remove(); document.removeEventListener("keydown", onKey); };
    const onKey = (e) => { if (e.key === "Escape") close(); };
    document.addEventListener("keydown", onKey);
    wrap.onclick = (e) => { if (e.target === wrap) close(); };
    wrap.querySelector("[data-close]").onclick = close;
    wrap.querySelectorAll("[data-a]").forEach((b) => b.onclick = () => {
      form.account.value = b.dataset.a; form.password.value = b.dataset.p;
      wrap.querySelectorAll("[data-a]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
      form.querySelector(".btn").focus();
    });
    form.onsubmit = async (e) => {
      e.preventDefault();
      const msg = wrap.querySelector("[data-msg]");
      try {
        const r = await fetch("/_auth/login", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ account: form.account.value, password: form.password.value }) });
        if (!r.ok) { msg.textContent = (await r.json().catch(() => ({}))).detail || "Sign-in failed."; return; }
        location.reload();
      } catch { msg.textContent = "Couldn't reach the server."; }
    };
    form.account.focus();
  }
  accountWidget();

  // Footer with the documents reviewers usually want next to the running app.
  const repo = "https://github.com/saipraneethpb1/BL-THA";
  if (current !== "hub") {
    const foot = Object.assign(document.createElement("footer"), { className: "s-foot" });
    foot.innerHTML = `<span>AI Tech Consultant</span><a href="${repo}" target="_blank" rel="noopener">Code</a><a href="${repo}/blob/main/EVALS.md" target="_blank" rel="noopener">Evals</a><a href="${repo}/blob/main/DESIGN.md" target="_blank" rel="noopener">Design</a>`;
    document.body.append(foot);
  }

  // Voice input. First choice: the browser's own live dictation (words appear as you speak).
  // It sends audio to Google or Microsoft and fails behind many VPNs, in Brave and similar
  // browsers, and doesn't exist in Firefox. Then we record and transcribe on our own server
  // (Whisper, /_speech), which works in every browser. The switch is remembered per visit.
  const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const speechUrl = deployed ? "/_speech" : null; // locally the proxy (and so the fallback) isn't there
  const canRecord = Boolean(speechUrl && navigator.mediaDevices?.getUserMedia && window.MediaRecorder);
  const preferServer = () => { try { return sessionStorage.getItem("speech-mode") === "server"; } catch { return false; } };
  const rememberServer = () => { try { sessionStorage.setItem("speech-mode", "server"); } catch {} };
  const MIC = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>`;
  let active = null; // { stop(), field }

  function insert(field, text, base) {
    field.value = (base ?? (field.value && !/\s$/.test(field.value) ? field.value + " " : field.value)) + text;
    field.dispatchEvent(new Event("input", { bubbles: true }));
  }
  function setState(btn, state) {
    btn.classList.toggle("on", state === "listening");
    btn.classList.toggle("busy", state === "busy");
    btn.innerHTML = state === "busy" ? `<span class="spinner"></span>` : MIC;
    btn.title = { listening: "Listening… click to stop", busy: "Turning your speech into text…" }[state] || "Speak instead of typing";
  }

  function startBrowser(field, btn) {
    const rec = new Recognition();
    rec.lang = field.dataset.micLang || navigator.language || "en-US";
    rec.continuous = true; rec.interimResults = true;
    const base = field.value && !/\s$/.test(field.value) ? field.value + " " : field.value;
    let finalText = "", failedOver = false;
    rec.onresult = (e) => {
      let interim = "";
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) finalText += t; else interim += t;
      }
      insert(field, finalText + interim, base);
    };
    rec.onerror = (e) => {
      if (["network", "service-not-allowed", "language-not-supported", "audio-capture"].includes(e.error) && canRecord) {
        failedOver = true; rememberServer();
        suite.toast("Your browser's dictation isn't available here; using the server's speech recognition instead.", 4500);
      } else {
        const msg = { "not-allowed": "Microphone access was blocked. Allow it in the address bar to use voice input.", "no-speech": "Didn't hear anything. Try again.", "network": "Your browser's dictation service can't be reached (a VPN or browser setting may block it)." }[e.error];
        if (msg) suite.toast(msg, 4500);
      }
    };
    rec.onend = () => {
      setState(btn, "idle"); if (active?.rec === rec) active = null;
      if (failedOver) startServer(field, btn);
    };
    try { rec.start(); } catch { return; }
    active = { rec, field, stop: () => rec.stop() };
    setState(btn, "listening"); field.focus();
  }

  async function startServer(field, btn) {
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch { suite.toast("Microphone access was blocked. Allow it in the address bar to use voice input.", 4500); return; }
    const type = ["audio/webm;codecs=opus", "audio/ogg;codecs=opus", "audio/mp4", "audio/webm"].find((t) => MediaRecorder.isTypeSupported(t)) || "";
    const recorder = new MediaRecorder(stream, type ? { mimeType: type } : undefined);
    const chunks = [];
    recorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
    const limit = setTimeout(() => recorder.state === "recording" && recorder.stop(), 60000);
    recorder.onstop = async () => {
      clearTimeout(limit); stream.getTracks().forEach((t) => t.stop());
      if (active?.recorder === recorder) active = null;
      const blob = new Blob(chunks, { type: recorder.mimeType || "audio/webm" });
      if (blob.size < 1000) { setState(btn, "idle"); suite.toast("Didn't hear anything. Try again."); return; }
      setState(btn, "busy");
      try {
        const r = await fetch(speechUrl, { method: "POST", headers: { "content-type": blob.type }, body: blob });
        const body = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(body.detail || `Error ${r.status}`);
        if (body.text) insert(field, body.text); else suite.toast("Didn't catch any words. Try again, a little closer to the mic.");
      } catch (err) { suite.toast(`Couldn't turn the recording into text: ${err.message}`, 5000); }
      finally { setState(btn, "idle"); field.focus(); }
    };

  v.innerHTML = `<div class="gm-head"><h2>${title}</h2><span>${items.length ? `1–${items.length} of ${items.length}` : ""}${q ? ` matching “${esc(q)}”` : ""}</span></div>${tip}` +
    (items.length ? items.map((e) => {
      const snip = String(e.body).replace(/\s+/g, " ").slice(0, 160);
      const st = e.status === "new" ? "" : `<span class="st ${esc(e.status)}">${esc(e.sent_mode === "auto" ? "Auto-sent" : STATUS[e.status] || e.status)}</span>`;
      return `<a class="gm-row ${e.status === "new" ? "unread" : ""}" href="#/mail/${encodeURIComponent(e.id)}">
        <svg class="imp ${esc(e.urgency || "")}" viewBox="0 0 12 12" aria-label="${e.urgency === "critical" || e.urgency === "high" ? esc(e.urgency) + " urgency" : ""}">${e.urgency === "critical" || e.urgency === "high" ? '<path d="M1 1h7l3 5-3 5H1l3-5z" fill="currentColor"/>' : ""}</svg>
        <span class="from">${esc(e.from_name)}</span>
        <span class="mid">${chip(e.category, false)}<span class="subj">${esc(e.subject || "(no subject)")}</span><span class="snip"> – ${esc(snip)}</span></span>
        ${st || "<span></span>"}
        <span class="date" title="${esc(when(e.received_at, true))}">${when(e.received_at)}</span></a>`;
    }).join("") : `<div class="empty">${q ? "No mail matches your search." : "Nothing here."}</div>`);
  // Rows are links, so their label chips can't be links too (links don't nest): a click on
  // a chip opens that label instead of the email.
  v.querySelectorAll(".gm-row .lbl").forEach((el) => el.addEventListener("click", (ev) => { ev.preventDefault(); ev.stopPropagation(); location.hash = `#/label/${el.dataset.cat}`; }));
}

function deliveryNote(id) {
  const e = emails.find((x) => x.id === id);
  if (!e?.from_gmail) return "";
  if (e.delivery?.startsWith("gmail:")) return `<div class="meta" style="margin-top:8px;color:var(--ok)">✓ Sent from ${esc(gmail.email || "Gmail")}, in the same thread</div>`;
  if (e.delivery?.startsWith("error:")) return `<div class="banner warn" style="margin-top:8px">Not delivered to Gmail: ${esc(e.delivery.slice(7))} <button class="btn secondary small" data-redeliver="${esc(id)}">Retry</button></div>`;
  return `<div class="meta" style="margin-top:8px">Sending through Gmail…</div>`;
}

// ----- one thread
async function openEmail(id) {
  const v = $("#view");
  let data;
  try { data = await api(`/api/emails/${encodeURIComponent(id)}`); }
  catch (e) { v.innerHTML = `<div class="empty">${esc(e.status === 404 ? "That email isn't in this inbox." : e.message)}</div>`; return; }
  if (route().kind !== "mail" || route().arg !== id) return; // the visitor moved on meanwhile
  const { email, draft, reviews } = data;
  const c = draft?.classification;
  const head = `<div class="gm-top" style="border:0;padding:8px 16px 0"><a class="gm-tool" href="${esc(lastList)}" title="Back" aria-label="Back to the list">${svg("back")}</a><span class="meta">${esc(email.id)}</span><span class="spacer"></span><span class="st ${esc(email.status)}">${esc(STATUS[email.status] || email.status)}</span></div>`;
  let html = `<div class="gm-subject">${esc(email.subject || "(no subject)")} ${c ? chip(c.category) + c.secondary.map((s) => chip(s)).join("") : ""}${c && URG[c.urgency] ? `<span class="badge ${URG[c.urgency]}">${esc(c.urgency)}</span>` : ""}</div>`;
  html += email.thread.map((t) => `<div class="msg earlier">${avatar(t.from)}<div><div class="msg-head"><b>${esc(t.from)}</b><span class="meta when">${esc(t.date)}</span></div><div class="msg-body">${esc(t.body)}</div></div></div>`).join("");
  html += `<div class="msg">${avatar(email.from_name)}<div><div class="msg-head"><b>${esc(email.from_name)}</b><span class="meta">&lt;${esc(email.from_email)}&gt;</span><span class="meta when">${esc(when(email.received_at, true))}</span></div><div class="meta">to support</div><div class="msg-body">${esc(email.body)}</div></div></div>`;
  if (email.status === "failed" && email.error) html += `<div class="banner warn" style="margin:12px 0 0 52px">The last attempt failed: ${esc(suite.friendlyError(email.error))}</div>`;

  if (!draft) {
    html += `<div class="assist"><h3>${svg("spark")}Inbox Agent</h3><p class="meta" style="margin:0 0 10px">Labels this email, asks the Knowledge Brain, and drafts a reply for you to review.</p>
      <div class="row" style="margin:0"><button class="btn pill" id="process" ${draftingOn ? "" : "disabled"}>Draft a reply</button><span class="meta" id="pmeta">${draftingOn ? "Usually 10–15 seconds." : "Drafting is off until the Claude API key is set."}</span></div></div>`;
    v.innerHTML = head + `<div class="gm-thread">${html}</div>`;
    if (draftingOn) $("#process").onclick = () => runProcess(id);
    return;
  }

  const label = labelOf(c.category);
  html += `<div class="assist"><h3>${svg("spark")}Inbox Agent</h3>
    <div class="row" style="margin:0">${chip(c.category)}<span class="meta">${esc(parentName(c.category))} › ${esc(label?.label || c.category)}</span><span class="badge">${esc(c.sentiment)}</span><span class="badge">${esc(c.language)}</span></div>
    <p class="meta" style="margin:8px 0 0">${esc(c.summary)}</p>`;
  if (draft.evidence.length) html += `<details style="margin-top:8px"${draft.evidence.length === 1 ? " open" : ""}><summary>What the Knowledge Brain said (${draft.evidence.length})</summary>` + draft.evidence.map((e) => `<div class="ev"><b>[${e.number}] ${esc(e.question)}</b> <span class="badge ${e.status === "answered" ? "ok" : "warn"}">${esc(e.status === "insufficient_evidence" ? "not covered" : e.status)}</span>${suite.md(e.answer)}<div class="meta">${e.sources.map((s) => s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>` : esc(s.title)).join(" · ")}</div></div>`).join("") + `</details>`;
  html += [
    ...draft.violations.map((x) => `<div class="flag ${x.severity}">${x.severity === "block" ? "Blocked from auto-send" : "Check"}: ${esc(x.message)}</div>`),
    draft.note_for_reviewer ? `<div class="flag info">Note: ${esc(draft.note_for_reviewer)}</div>` : "",
    draft.secrets_found ? `<div class="flag warn">A card number or password was removed before drafting. Don't paste it back.</div>` : "",
  ].join("");
  html += `<div class="meta" style="margin-top:8px">${esc(Object.values(draft.models).join(" · "))} · ${(draft.latency_ms / 1000).toFixed(1)} s · $${draft.cost_usd.toFixed(4)}${draft.auto_send_blocker ? ` · not auto-sent: ${esc(draft.auto_send_blocker)}` : ""}</div></div>`;

  const done = email.status !== "drafted";
  if (done) {
    const final = [...reviews].reverse().find((r) => r.final_body);
    const auto = reviews.some((r) => r.outcome === "auto_sent");
    if (email.status === "sent") {
      html += `<div class="msg">${avatar(auto ? "Inbox Agent" : reviewer())}<div><div class="msg-head"><b>${auto ? "Inbox Agent (sent automatically)" : esc(final?.reviewer || "You")}</b><span class="meta">to ${esc(email.from_email)}</span><span class="meta when">${esc(when((final || reviews.at(-1))?.created_at?.replace(" ", "T") + "Z", true))}</span></div><div class="meta">${esc(final?.final_subject || draft.subject)}</div><div class="msg-body">${esc(final?.final_body || draft.body)}</div>${deliveryNote(email.id)}</div></div>`;
    }
  } else {
    html += `<div class="reply"><div class="reply-to">Reply to <b style="color:var(--text)">${esc(email.from_name)}</b> &lt;${esc(email.from_email)}&gt; · drafted by the agent, edit freely</div>
      <input class="subj" id="subj" value="${esc(draft.subject)}" aria-label="Subject">
      <textarea id="body" data-mic aria-label="Reply">${esc(draft.body)}</textarea>
      <div class="reply-foot"><button class="btn pill" id="send">Send</button>
        <button class="btn secondary small" id="reject" title="The draft was wrong: send your text and record why">Send my own reply</button>
        <button class="btn secondary small" id="escalate">Escalate</button>
        <button class="btn ghost small" id="archive">Archive</button>
        <input class="why" id="why" placeholder="Reason (to reject or escalate)" aria-label="Reason">
        <input id="who" value="${esc(reviewer())}" aria-label="Your name" title="Your name, recorded with the review" style="max-width:130px">
      </div><div class="meta" id="note" style="padding:0 14px 10px"></div></div>`;
  }
  if (reviews.length) html += `<details class="gm-history"><summary>History (${reviews.length})</summary>` + reviews.map((r) => `<div class="meta">${esc(r.created_at)} · ${esc(r.outcome.replace("_", " "))} by ${esc(r.reviewer || "agent")}${r.reason ? ` · ${esc(r.reason)}` : ""}${r.spot_check ? " · picked for spot check" : ""}</div>`).join("") + `</details>`;
  v.innerHTML = head + `<div class="gm-thread">${html}</div>`;
  v.querySelectorAll("[data-redeliver]").forEach((b) => b.onclick = async () => {
    b.disabled = true;
    try { await api(`/api/gmail/deliver/${encodeURIComponent(b.dataset.redeliver)}`, { method: "POST" }); suite.toast("Sent from Gmail"); }
    catch (e) { suite.toast(e.message, 5000); }
    await loadEmails(false); openEmail(id);
  });
  if (done) return;

  const body = $("#body"), original = draft.body;
  const streak = await api("/api/autonomy").then((a) => a.categories.find((x) => x.kind === c.category)).catch(() => null);
  const hint = () => {
    const edited = body.value.trim() !== original.trim();
    $("#send").textContent = edited ? "Send edited" : "Send";
    $("#note").textContent = !streak || !streak.eligible ? `${CAT[c.category]}: auto-send is off for this label (Settings).` :
      edited ? `Sending an edit resets ${CAT[c.category]} to 0 of ${META.autonomy_threshold} unedited approvals.` : `Sending unchanged makes it ${streak.streak + 1} of ${META.autonomy_threshold} unedited approvals for ${CAT[c.category]}.`;
  };
  body.oninput = hint; hint();
  const act = async (payload, msg) => {
    const who = $("#who").value.trim();
    if (!who) { $("#note").textContent = "Add your name first."; return; }
    saveReviewer(who);
    try {
      const r = await api(`/api/emails/${encodeURIComponent(id)}/review`, { method: "POST", body: JSON.stringify({ reviewer: who, ...payload }) });
      suite.toast(r.autonomy?.status === "autonomous" && streak?.status !== "autonomous" ? `${CAT[c.category]} reached ${META.autonomy_threshold}: its replies now send automatically` : msg, 4000);
      if (r.delivery_error) banner(`Saved, but Gmail didn't send it: ${r.delivery_error}`, "warn");
      await loadEmails(false); openEmail(id);
    } catch (e) { $("#note").textContent = e.message; }
  };
  const why = () => $("#why").value.trim();
  const need = (what) => { $("#note").textContent = what; $("#why").focus(); };
  $("#send").onclick = () => act({ action: "send", subject: $("#subj").value, body: body.value, ...(why() ? { reason: why() } : {}) }, body.value.trim() === original.trim() ? "Sent unchanged: counts towards auto-send" : "Sent with your edits: recorded as a correction");
  $("#reject").onclick = () => why() ? act({ action: "reject", subject: $("#subj").value, body: body.value, reason: why() }, "Sent your reply; the draft is marked wrong") : need("Say why the draft was wrong.");
  $("#escalate").onclick = () => why() ? act({ action: "escalate", reason: why() }, "Escalated") : need("Say why it needs escalating.");
  $("#archive").onclick = () => act({ action: "archive", ...(why() ? { reason: why() } : {}) }, "Archived");
}

async function runProcess(id) {
  const btn = $("#process"); btn.disabled = true;
  const started = Date.now();
  const tick = () => { const s = Math.round((Date.now() - started) / 1000); btn.innerHTML = `<span class="spinner" style="border-top-color:currentColor"></span>Drafting… ${s} s`; $("#pmeta").textContent = s < 4 ? "Labelling the email…" : s < 9 ? "Asking the Knowledge Brain…" : "Writing and checking the reply…"; };
  tick(); const timer = setInterval(tick, 1000);
  try { const r = await api(`/api/emails/${encodeURIComponent(id)}/process`, { method: "POST" }); if (r.autoSent) suite.toast("Sent automatically: this label has earned auto-send", 4000); if (r.delivery_error) banner(`Gmail: ${r.delivery_error}`, "warn"); }
  catch (e) { banner(suite.friendlyError(e.message), e.status === 502 ? "warn" : "err"); }
  clearInterval(timer); window.dispatchEvent(new Event("suite:usage-changed"));
  await loadEmails(false); openEmail(id);
}

// ----- compose: writes a customer email into this inbox (until Gmail is connected)
function compose() {
  const old = $(".cw"); if (old) { old.classList.remove("min"); $("input", old).focus(); return; }
  const w = Object.assign(document.createElement("form"), { className: "cw" });
  w.setAttribute("aria-label", "New message");
  w.innerHTML = `<div class="cw-head">New message<button class="gm-tool" type="button" data-min title="Minimise" aria-label="Minimise" style="width:28px;height:28px">–</button><button class="gm-tool" type="button" data-x title="Close" aria-label="Close" style="width:28px;height:28px;margin-left:0">✕</button></div>
    <div class="hint">${gmail.connected ? "Test message: it lands in this inbox only (not in Gmail). To test with real mail, email " + esc(gmail.email) + " from another address, then Sync now." : "Write as a customer: the message lands in this inbox, like a real email arriving."}</div>
    <input name="name" placeholder="From (name)" required maxlength="80" value="Test Customer">
    <input name="email" type="email" placeholder="From (email)" required value="customer@example.com">
    <input name="subject" placeholder="Subject" maxlength="200">
    <textarea name="body" data-mic placeholder="e.g. How do I add a new membership plan to my site?" required maxlength="5000"></textarea>
    <div class="cw-foot"><button class="btn pill">Send to inbox</button><label><input type="checkbox" name="draft" ${draftingOn ? "checked" : "disabled"}> Draft a reply straight away</label><span class="meta" data-msg></span></div>`;
  document.body.append(w);
  $("[data-x]", w).onclick = () => w.remove();
  $("[data-min]", w).onclick = () => w.classList.toggle("min");
  $(".cw-head", w).ondblclick = () => w.classList.toggle("min");
  w.onsubmit = async (ev) => {
    ev.preventDefault();
    const f = w.elements, id = `C${Date.now().toString(36).toUpperCase()}`;
    try {
      await api("/api/emails", { method: "POST", body: JSON.stringify({ id, from: { name: f.name.value.trim(), email: f.email.value.trim() }, subject: f.subject.value.trim(), body: f.body.value }) });
      const draftNow = f.draft.checked; w.remove();
      await loadEmails(false);
      location.hash = `#/mail/${id}`;
      if (draftNow) setTimeout(() => $("#process")?.click(), 300);
    } catch (e) { $("[data-msg]", w).textContent = e.message; }
  };
  $("textarea", w).focus();
}

// ----- settings: X and which labels may auto-send, grouped by parent type
async function renderSettings() {
  const v = $("#view");
  const [s, a] = await Promise.all([api("/api/settings"), api("/api/autonomy")]).catch(() => [null, null]);
  if (!s) { v.innerHTML = `<div class="empty">Couldn't load settings.</div>`; return; }
  META = s;
  const st = new Map(a.categories.map((c) => [c.kind, c]));
  const [lo, hi] = s.threshold_range;
  v.innerHTML = `<div class="gm-page"><h2>Settings</h2>
    <p class="sub">${account ? `For <b>${esc(account)}</b>'s inbox. Other accounts keep their own settings.` : "For the shared guest inbox. Sign in with a demo account (top right) to change settings for your own inbox."}</p>
    <h3 class="label">Auto-send threshold</h3>
    <div class="set-x"><input type="number" id="x" min="${lo}" max="${hi}" value="${s.autonomy_threshold}" aria-label="Threshold X">
      <input type="range" id="xr" min="${lo}" max="${Math.min(hi, 50)}" value="${Math.min(s.autonomy_threshold, 50)}" aria-label="Threshold X slider">
      <div class="meta" style="flex-basis:100%">A label's replies send automatically once <b id="xv">${s.autonomy_threshold}</b> drafts in a row were sent without any change. Any edit, rejection, escalation or failed spot check resets that label to 0. Default ${s.default_threshold}. Critical, angry or suspicious emails always go to a person.</div></div>
    <h3 class="label">Labels and their parent types</h3>
    <p class="meta" style="margin:0">Every email gets one label; each label belongs to a parent type. Switch auto-send off for a label to keep a person on every reply. High-risk labels start switched off.</p>
    ${s.parents.map((p) => `<div class="set-group"><header><span class="ldot parent" style="--c:var(--p-${p.id});border-radius:50%"></span><b>${esc(p.label)}</b><span class="meta">${esc(p.description)}</span></header>
      ${s.labels.filter((l) => l.parent === p.id).map((l) => { const x = st.get(l.id) || { streak: 0, status: "supervised" };
        return `<div class="set-row"><div><span class="lbl" style="--c:var(--p-${p.id})">${esc(CAT[l.id] || l.label)}</span><b>${esc(l.label)}</b><div class="def">${esc(l.definition)}</div></div>
          <span class="risk"><span class="badge ${l.risk === "high" ? "err" : l.risk === "medium" ? "warn" : ""}">${esc(l.risk)} risk</span></span>
          <div class="prog" data-prog="${l.id}"><span class="meta">${x.status === "autonomous" ? "<b style='color:var(--ok)'>Auto-sending</b>" : `${x.streak} of <span data-x>${s.autonomy_threshold}</span> unedited`}</span><div class="meter"><div style="width:${Math.min(100, (x.streak / s.autonomy_threshold) * 100)}%"></div></div></div>
          <label class="switch" title="May this label auto-send?"><input type="checkbox" data-label="${l.id}" ${l.auto_send ? "checked" : ""} aria-label="Auto-send ${esc(l.label)}"><span></span></label></div>`; }).join("")}</div>`).join("")}
    <div class="save-bar"><button class="btn" id="save">Save settings</button><span class="meta" id="smsg"></span></div></div>`;
  const x = $("#x"), xr = $("#xr");
  const sync = (val) => { $("#xv").textContent = val; v.querySelectorAll("[data-x]").forEach((el) => el.textContent = val); };
  x.oninput = () => { xr.value = Math.min(Number(x.value) || lo, 50); sync(x.value); };
  xr.oninput = () => { x.value = xr.value; sync(xr.value); };
  $("#save").onclick = async () => {
    const n = Number(x.value);
    if (!Number.isInteger(n) || n < lo || n > hi) { $("#smsg").textContent = `X must be a whole number from ${lo} to ${hi}.`; return; }
    const auto_send = Object.fromEntries([...v.querySelectorAll("[data-label]")].map((c) => [c.dataset.label, c.checked]));
    const risky = s.labels.filter((l) => auto_send[l.id] && !l.auto_send && l.risk === "high");
    if (risky.length && !confirm(`Allow auto-send for ${risky.map((l) => l.label).join(", ")}? These are high-risk: replies will go out without a person once ${n} in a row are approved unchanged.`)) return;
    try {
      const r = await api("/api/settings", { method: "PUT", body: JSON.stringify({ autonomy_threshold: n, auto_send, actor: reviewer() }) });
      const g = r.events.filter((e) => e.event === "granted").length, k = r.events.filter((e) => e.event === "revoked").length;
      suite.toast(`Saved.${g ? ` ${g} label(s) now auto-send.` : ""}${k ? ` ${k} label(s) back under review.` : ""}`, 4000);
      renderSettings();
    } catch (e) { $("#smsg").textContent = e.message; }
  };
}

// ----- autonomy and learning pages
async function renderAutonomy() {
  const v = $("#view");
  const a = await api("/api/autonomy").catch(() => null);
  if (!a) { v.innerHTML = `<div class="empty">Couldn't load autonomy.</div>`; return; }
  v.innerHTML = `<div class="gm-page"><h2>Which labels send on their own</h2>
    <p class="sub">A label earns auto-send after <b>${a.threshold}</b> drafts in a row are sent unchanged (<a href="#/settings">change X in Settings</a>). One edit, rejection or failed spot check resets it to zero.</p>
    <div class="table-wrap"><table><thead><tr><th>Label</th><th>Parent type</th><th>Status</th><th>Unedited in a row</th><th></th></tr></thead><tbody>${a.categories.map((c) => {
      const never = !c.eligible, pct = Math.min(100, (c.streak / a.threshold) * 100);
      return `<tr><td>${chip(c.kind)}</td><td class="meta">${esc(META.parents.find((p) => p.id === c.parent)?.label || "")}</td><td><span class="badge ${never ? "" : c.status === "autonomous" ? "ok" : "info"}">${never ? "auto-send off" : c.status === "autonomous" ? "auto-sending" : "supervised"}</span></td>
        <td>${never ? `<span class="meta">n/a</span>` : `<div class="meter" style="max-width:160px"><div style="width:${pct}%"></div></div><span class="meta">${c.streak} / ${a.threshold}</span>`}</td>
        <td>${c.status === "autonomous" ? `<button class="btn secondary small" data-revoke="${esc(c.kind)}">Revoke</button>` : ""}</td></tr>`; }).join("")}</tbody></table></div>
    <h3 class="label">Spot checks waiting</h3><div id="spots"></div>
    <h3 class="label">Recent changes</h3><div id="events"></div></div>`;
  v.querySelectorAll("[data-revoke]").forEach((b) => b.onclick = async () => {
    const reason = prompt("Why revoke auto-send for this label?");
    if (reason) { await api(`/api/autonomy/${b.dataset.revoke}/revoke`, { method: "POST", body: JSON.stringify({ reason }) }); renderAutonomy(); }
  });
  $("#spots").innerHTML = a.pending_spot_checks.length ? a.pending_spot_checks.map((s) => `<div class="row"><span>${esc(s.email_id)} ${chip(s.category)} auto-sent ${esc(s.created_at)}</span><a class="btn secondary small" href="#/mail/${esc(s.email_id)}">Read</a><button class="btn secondary small" data-spot="${esc(s.email_id)}" data-ok="1">Looks right</button><button class="btn secondary small" data-spot="${esc(s.email_id)}" data-ok="0">Wrong: revoke</button></div>`).join("") : `<div class="meta">None.</div>`;
  v.querySelectorAll("[data-spot]").forEach((b) => b.onclick = async () => {
    const ok = b.dataset.ok === "1"; const reason = ok ? "" : prompt("What was wrong?") || "";
    await api(`/api/emails/${encodeURIComponent(b.dataset.spot)}/review`, { method: "POST", body: JSON.stringify({ action: "spot_check", ok, reviewer: reviewer(), ...(reason ? { reason } : {}) }) });
    renderAutonomy();
  });
  $("#events").innerHTML = a.events.length ? a.events.map((e) => `<div class="meta">${esc(e.created_at)} · ${e.kind === "settings" ? "Settings" : esc(CAT[e.kind] || e.kind)} · ${esc(e.event.replace("_", " "))} · ${esc(e.detail)}${e.email_id ? ` (${esc(e.email_id)})` : ""}</div>`).join("") : `<div class="meta">Nothing yet.</div>`;
}

const pct = (x) => `${Math.round(x * 100)}%`;
async function renderLearning() {
  const v = $("#view");
  const data = await api("/api/learning").catch(() => null);
  if (!data) { v.innerHTML = `<div class="empty">Couldn't load learning.</div>`; return; }
  const busy = data.categories.filter((c) => c.versions.length || c.corrections_since_active || c.metrics.length);
  v.innerHTML = `<div class="gm-page"><h2>What the agent has learned from your edits</h2>
    <p class="sub">After a few edits to the same label, the agent can propose lessons. A lesson goes live only after a check: past emails are re-drafted with and without it and compared with what you actually sent. Every change can be rolled back.</p>
    <div id="learning">${busy.length ? busy.map((c) => {
      const candidate = c.versions.find((x) => x.status === "candidate");
      const ev = candidate?.evaluation;
      return `<div class="ev" data-cat="${esc(c.category)}" style="padding:14px 16px">
        <div class="row" style="margin:0;justify-content:space-between">${chip(c.category)}<span class="meta">lessons v${c.active.version} live · ${c.corrections_since_active} correction(s) since</span></div>
        ${c.active.lessons.length ? `<ul>${c.active.lessons.map((l) => `<li>${esc(l.text)}</li>`).join("")}</ul>` : `<div class="meta">No lessons yet: drafts follow the base prompt.</div>`}
        ${c.metrics.length ? `<div class="table-wrap"><table style="margin-top:8px"><thead><tr><th>Lessons</th><th>Drafts reviewed</th><th>Sent without changes</th><th>Closeness to what was sent</th></tr></thead><tbody>${c.metrics.map((m) => `<tr><td>v${m.version}</td><td>${m.reviewed}</td><td>${pct(m.unchanged_rate)}</td><td>${pct(m.mean_similarity)}</td></tr>`).join("")}</tbody></table></div>` : ""}
        ${candidate ? `<h3 class="label">Proposed lessons v${candidate.version}</h3><ul>${candidate.lessons.map((l) => `<li>${esc(l.text)} <span class="meta">(from ${l.review_ids.length} correction(s))</span></li>`).join("")}</ul>
          ${ev ? `<div class="flag ${ev.recommended ? "info" : "warn"}">${esc(ev.verdict)}<br><span class="meta">Unseen emails: ${pct(ev.unseen_before)} → ${pct(ev.unseen_after)} close to what was sent (${ev.unseen_n} emails). All: ${pct(ev.mean_before)} → ${pct(ev.mean_after)}. Policy violations: ${ev.violations_before} → ${ev.violations_after}.</span></div>` : `<div class="meta">Not checked yet.</div>`}
          <div class="row"><button class="btn secondary" data-act="evaluate" data-v="${candidate.version}">${ev ? "Check again" : "Run the check"}</button>${ev ? `<button class="btn" data-act="promote" data-v="${candidate.version}">Make live</button>` : ""}<button class="btn ghost" data-act="reject" data-v="${candidate.version}">Reject</button></div>`
        : `<div class="row">${c.corrections_since_active >= 3 ? `<button class="btn secondary" data-act="propose">Propose lessons from my edits</button>` : `<span class="meta">Needs 3 corrections to propose lessons.</span>`}${c.active.version ? `<button class="btn ghost" data-act="rollback">Roll back to the previous lessons</button>` : ""}</div>`}
        <div class="meta" data-note></div></div>`;
    }).join("") : `<div class="empty">Nothing yet. Edit a few drafts with the same label before sending them, and lessons can be proposed here.</div>`}</div>
    <h3 class="label">History</h3><div>${data.events.length ? data.events.map((e) => `<div class="meta">${esc(e.created_at)} · ${esc(CAT[e.category] || e.category)} v${e.version} · ${esc(e.event)} by ${esc(e.actor)}${e.detail ? ` · ${esc(e.detail)}` : ""}</div>`).join("") : `<div class="meta">Nothing yet.</div>`}</div></div>`;
  v.querySelectorAll("#learning [data-act]").forEach((b) => b.onclick = async () => {
    const card = b.closest("[data-cat]"); const cat = card.dataset.cat; const note = $("[data-note]", card);
    const who = reviewer(); saveReviewer(who);
    const act = b.dataset.act; const ver = b.dataset.v;
    const body = { actor: who };
    if (act === "reject" || act === "rollback") { const r = prompt(act === "reject" ? "Why reject these lessons?" : "Why roll back?"); if (!r) return; body.note = r; }
    if (act === "promote") {
      const cand = (await api("/api/learning")).categories.find((c) => c.category === cat).versions.find((x) => x.version === Number(ver));
      if (!cand.evaluation?.recommended) { const r = prompt("The check did not recommend these lessons. Why make them live anyway?"); if (!r) return; body.note = r; }
    }
    const path = act === "propose" || act === "rollback" ? `/api/learning/${cat}/${act}` : `/api/learning/${cat}/${ver}/${act}`;
    b.disabled = true; note.textContent = act === "evaluate" ? "Re-drafting past emails with and without the lessons…" : "";
    try { await api(path, { method: "POST", body: JSON.stringify(body) }); renderLearning(); }
    catch (e) { note.textContent = e.message; b.disabled = false; }
  });
}

// ----- start
async function loadEmails(rerender = true) {
  const r = await api("/api/emails").catch(() => null);
  if (!r) return;
  emails = r;
  if (rerender) render(); else renderSide(route());
}
$("#compose-btn").onclick = compose;
$("#menu").onclick = () => $("#gm").classList.toggle("side-open");
$("#reload").onclick = () => loadEmails();
let qTimer; $("#q").oninput = () => { clearTimeout(qTimer); qTimer = setTimeout(() => { const r = route(); if (r.kind === "mail" || !["folder", "label", "parent"].includes(r.kind)) location.hash = "#/folder/all"; else renderList(r); }, 150); };
document.addEventListener("keydown", (e) => {
  if (e.target.closest("input, textarea, select, [contenteditable]")) return;
  if (e.key === "c" && !e.ctrlKey && !e.metaKey) { e.preventDefault(); compose(); }
  if (e.key === "/") { e.preventDefault(); $("#q").focus(); }
});

(async () => {
  const [h, s, sess] = await Promise.all([api("/health").catch(() => null), api("/api/settings").catch(() => null), api("/api/session").catch(() => null)]);
  draftingOn = Boolean(h?.drafting_enabled);
  if (s) META = s;
  account = sess && sess.workspace !== "guest" ? sess.workspace : null;
  $("#s-right").innerHTML = h ? `<span class="badge ${draftingOn ? "ok" : "warn"}">${draftingOn ? "Drafting on" : "Drafting off"}</span>` : "";
  if (h && !draftingOn) banner("Drafting is off until ANTHROPIC_API_KEY is set. You can still browse the inbox.", "info");
  await Promise.all([loadGmail(), loadEmails()]);
  // A connected Gmail inbox fills in the background: refresh the list now and then.
  setInterval(() => { if (gmail.connected && document.visibilityState === "visible") { loadGmail(); loadEmails(route().kind !== "mail"); } }, 60_000);
})();
</script>
