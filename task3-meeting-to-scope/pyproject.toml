[project]
name = "meeting-to-scope"
version = "0.1.0"
description = "Meeting to Scope of Work (Task 3): transcripts to scope, estimate and proposal"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    # Below 2.0: 2.0 sends API version 2026-10-21, which Bedrock rejects for Claude 4.6 and older.
    "anthropic[bedrock]>=1.15.0,<2",
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
strict = true
python_version = "3.12"
packages = ["scope"]
