<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const VERDICT = { existing_configuration: ["Built-in setting", "ok"], existing_with_limitation: ["Built-in, with limits", "warn"], custom_development: ["Custom work", "info"], needs_clarification: ["Needs clarification", "err"] };
const VSTATUS = { approved: "ok", draft: "warn", building: "info", failed: "err", superseded: "" };
const RSTATUS = { confirmed: "ok", unclear: "warn", disputed: "err" };
const CHANGE = { added: "info", modified: "warn", removed: "err", unchanged: "" };
let state = { pid: null, version: null, tab: "requirements", building: true };
let poll = null, samples = [];

async function api(path, options = {}) {
  const headers = options.body ? { "content-type": "application/json" } : {};
  let res;
  try { res = await fetch(path, { ...options, headers }); } catch { banner("The Scope Builder isn't reachable."); throw new Error("offline"); }
  const isText = (res.headers.get("content-type") || "").startsWith("text/plain");
  const body = isText ? await res.text() : await res.json().catch(() => ({}));
  if (!res.ok) { const d = body.detail; throw new Error(typeof d === "string" ? d : Array.isArray(d) ? d.map((x) => `${x.loc.at(-1)}: ${x.msg}`).join("; ") : `Error ${res.status}`); }
  $("#banner").hidden = true;
  return body;
}
function banner(msg, kind = "err") { const b = $("#banner"); b.className = `banner ${kind}`; b.textContent = msg; b.hidden = false; }
function actor() { try { return localStorage.getItem("reviewer") || "Reviewer"; } catch { return "Reviewer"; } }
function saveActor(v) { try { localStorage.setItem("reviewer", v); } catch {} }

async function loadProjects() {
  const ps = await api("/api/projects").catch(() => []);
  $("#projects").innerHTML = ps.length ? ps.map((p) => `<button class="proj ${p.id === state.pid ? "sel" : ""}" data-id="${p.id}"><b>${esc(p.name)}</b><div class="meta">${esc(p.client)} · ${p.meetings} meeting${p.meetings === 1 ? "" : "s"}${p.latest_version ? ` · v${p.latest_version}` : ""}</div></button>`).join("") : `<div class="meta">No projects yet.</div>`;
  document.querySelectorAll("#projects .proj").forEach((el) => el.onclick = () => openProject(Number(el.dataset.id)));
  return ps;
}
$("#p-create").onclick = async () => {
  try { const r = await api("/api/projects", { method: "POST", body: JSON.stringify({ name: $("#p-name").value, client: $("#p-client").value }) }); $("#p-name").value = $("#p-client").value = ""; await loadProjects(); openProject(r.id); }
  catch (e) { banner(e.message); }
};

function welcome(projects) {
  $("#main").innerHTML = `<div class="panel">
    <h2>Try it with a real client meeting</h2>
    <p class="sub">The samples are real recorded design meetings from the public AMI corpus: a team scoping a TV remote control. The follow-up meeting changes earlier decisions, which shows the scope comparison.</p>
    <ol class="steps" style="margin-bottom:16px">
      <li><div><b>Create the demo project</b><span class="meta"> with the first meeting (ES2002c) already added.</span></div></li>
      <li><div><b>Build the scope</b><span class="meta">: about 2 minutes. The agents extract requirements with quotes, check each against the product, then scope, estimate and write a proposal.</span></div></li>
      <li><div><b>Approve it</b><span class="meta">, then add the follow-up meeting (ES2002d) and update: the new version is compared with what you approved.</span></div></li>
    </ol>
    <div class="row"><button class="btn" id="demo">Create the demo project</button>${projects.length ? `<span class="meta">or pick a project on the left${projects.some((p) => p.latest_version) ? " (some are already built)" : ""}.</span>` : ""}</div>
  </div>`;
  $("#demo").onclick = createDemo;
}
$("#p-demo").onclick = () => { clearInterval(poll); state.pid = null; loadProjects(); welcome([]); };

async function createDemo() {
  const b = $("#demo"); b.disabled = true; b.innerHTML = `<span class="spinner" style="border-top-color:currentColor"></span>Creating…`;
  try {
    const { id } = await api("/api/projects", { method: "POST", body: JSON.stringify({ name: "TV remote control", client: "Real Reaction (AMI demo)" }) });
    await addSample(id, "ami_ES2002c");
    await loadProjects(); openProject(id);
  } catch (e) { banner(e.message); b.disabled = false; b.textContent = "Create the demo project"; }
}
async function addSample(pid, name) {
  const s = samples.find((x) => x.name === name);
  const transcript = await api(`/api/samples/${name}`);
  return api(`/api/projects/${pid}/meetings`, { method: "POST", body: JSON.stringify({ title: s.title, date: s.date, transcript }) });
}

function nextStep(p) {
  const latest = p.versions[0];
  const approved = p.versions.find((v) => v.status === "approved");
  if (!p.meetings.length) return [0, "Add a meeting transcript below: paste, upload, or pick a sample."];
  if (!latest) return [1, "Click <b>Build scope</b>. It takes about 2 minutes for a 40-minute meeting."];
  if (latest.status === "building") return [1, "Building… the agents are reading the transcript."];
  if (latest.status === "failed") return [1, "The last build failed (details below). Fix the cause and build again."];
  if (latest.status === "draft") return [latest.baseline_version ? 4 : 2, latest.baseline_version
    ? `Open the <b>Changes</b> tab: what the follow-up changed compared with approved v${latest.baseline_version}. Then approve it.`
    : "Review the tabs, then open <b>Review &amp; approve</b>. Only an approved version can be sent to the client."];
  const newerMeeting = approved && p.meetings.length > 1 && latest.status === "approved" && !p.versions.some((v) => v.baseline_version === approved.number);
  return [4, newerMeeting ? "A new meeting is waiting: click <b>Update scope from new meetings</b>." : "Approved. Add a follow-up meeting (try the ES2002d sample) and click <b>Update scope</b> to see what changed."];
}

async function openProject(pid, version = null) {
  state.pid = pid; clearInterval(poll);
  await loadProjects();
  const p = await api(`/api/projects/${pid}`);
  const latest = p.versions[0];
  state.version = version ?? latest?.number ?? null;
  const [stage, hint] = nextStep(p);
  const approvedExists = p.versions.some((v) => v.status === "approved");
  const unused = samples.filter((s) => !p.meetings.some((m) => m.title === s.title));
  $("#main").innerHTML = `
    <div class="panel">
      <div class="row" style="margin-top:0;justify-content:space-between"><div><h2 style="margin:0">${esc(p.project.name)}</h2><div class="meta">Client: ${esc(p.project.client)}</div></div></div>
      <div class="flow">${["Add meeting", "Build", "Review", "Approve", "Follow-up"].map((s, i) => `<span class="${i < stage ? "done" : i === stage ? "now" : ""}">${s}</span>`).join("")}</div>
      <div class="guide"><span>→</span><div>${hint}</div></div>
      <h3 class="label">Meetings</h3>
      <div class="meetings">${p.meetings.length ? p.meetings.map((m) => `<div class="meeting"><b>${esc(m.date)}</b><span>${esc(m.title)}</span><span class="meta">${esc(m.id)}</span></div>`).join("") : `<div class="meta">No meetings yet.</div>`}</div>
      <details class="addbox" ${p.meetings.length ? "" : "open"}><summary style="cursor:pointer;font-weight:600">+ Add a meeting transcript</summary>
        ${unused.length ? `<div class="row"><select id="m-sample" style="flex:1;min-width:220px"><option value="">Pick a sample meeting…</option>${unused.map((s) => `<option value="${esc(s.name)}">${esc(s.title)}</option>`).join("")}</select><button class="btn secondary" id="m-add-sample">Add sample</button></div><div class="meta" style="margin-top:8px">or paste / upload your own:</div>` : ""}
        <div class="row"><input id="m-title" placeholder="Meeting title, e.g. Kickoff call" style="flex:2;min-width:180px"><input id="m-date" type="date" style="flex:1;min-width:140px"></div>
        <textarea id="m-text" data-mic style="margin-top:8px" placeholder="Paste a transcript, or dictate meeting notes with the mic, e.g.&#10;[00:00:05] Sam: Thanks for joining...&#10;[00:00:12] Priya: The search is bad..."></textarea>
        <div class="row"><input type="file" id="m-file" accept=".txt,.vtt,.md" style="flex:1;min-width:200px"><button class="btn secondary" id="m-add">Add meeting</button><span class="meta" id="m-note"></span></div>
      </details>
      <div class="row">
        <button class="btn" id="build" ${state.building && p.meetings.length && latest?.status !== "building" ? "" : "disabled"}>${approvedExists ? "Update scope from new meetings" : "Build scope"}</button>
        <span class="meta">${state.building ? "Each build makes a new draft version. Usually about 2 minutes, about $0.30." : "Building is off until Claude on Amazon Bedrock is configured."}</span>
      </div>
      ${p.versions.length ? `<h3 class="label">Versions</h3><div class="versions">${p.versions.map((v) => `<button class="vbtn" data-v="${v.number}" aria-pressed="${v.number === state.version}">v${v.number} <span class="badge ${VSTATUS[v.status] ?? ""}">${esc(v.status)}</span>${v.baseline_version ? `<span class="meta">vs v${v.baseline_version}</span>` : ""}</button>`).join("")}</div>` : ""}
    </div>
    <div id="version"></div>
    <div class="panel"><h3 class="label" style="margin-top:0">Audit trail</h3><div class="audit">${p.audit.map((a) => `<div class="meta">${esc(a.created_at)} · ${a.version_number ? `v${a.version_number} · ` : ""}${esc(a.action)} · ${esc(a.actor)}${a.detail ? ` · ${esc(a.detail)}` : ""}</div>`).join("") || `<div class="meta">Nothing yet.</div>`}</div></div>`;
  $("#m-file").onchange = async (e) => { const f = e.target.files[0]; if (f) { $("#m-text").value = await f.text(); if (!$("#m-title").value) $("#m-title").value = f.name.replace(/\.[^.]+$/, ""); } };
  $("#m-add").onclick = async () => {
    try { const r = await api(`/api/projects/${pid}/meetings`, { method: "POST", body: JSON.stringify({ title: $("#m-title").value, date: $("#m-date").value, transcript: $("#m-text").value }) }); suite.toast(`Added ${r.id}: ${r.turns} turns from ${r.speakers.length} speakers`); openProject(pid); }
    catch (e) { $("#m-note").textContent = e.message; }
  };
  const addS = $("#m-add-sample");
  if (addS) addS.onclick = async () => {
    const name = $("#m-sample").value; if (!name) { $("#m-note").textContent = "Pick a sample first."; return; }
    addS.disabled = true;
    try { const r = await addSample(pid, name); suite.toast(`Added ${r.id}: ${r.turns} turns`); openProject(pid); }
    catch (e) { $("#m-note").textContent = e.message; addS.disabled = false; }
  };
  $("#build").onclick = async () => {
    try { const r = await api(`/api/projects/${pid}/build`, { method: "POST" }); openProject(pid, r.version); }
    catch (e) { banner(e.message); }
  };
  document.querySelectorAll("[data-v]").forEach((b) => b.onclick = () => openProject(pid, Number(b.dataset.v)));
  if (state.version) loadVersion();
}

async function loadVersion() {
  const v = await api(`/api/projects/${state.pid}/versions/${state.version}`);
  const box = $("#version");
  if (v.status === "building") {
    const started = Date.parse(v.created_at.endsWith("Z") || v.created_at.includes("+") ? v.created_at : v.created_at + "Z") || Date.now();
    const stage = (s) => s < 60 ? "Reading the transcript in parts and extracting requirements with quotes…" : s < 100 ? "Checking each requirement against the product (Knowledge Brain)…" : "Scoping, estimating, writing and reviewing the proposal…";
    const render = () => { const s = Math.max(0, Math.round((Date.now() - started) / 1000)); box.innerHTML = `<div class="panel"><div class="progress"><span class="spinner"></span><div><b>Building version ${v.number}</b> · ${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}<div class="meta">${stage(s)} Usually about 2 minutes.</div></div></div></div>`; };
    render(); clearInterval(poll);
    let n = 0;
    poll = setInterval(async () => { render(); if (++n % 3) return; const x = await api(`/api/projects/${state.pid}/versions/${state.version}`).catch(() => null); if (x && x.status !== "building") { clearInterval(poll); window.dispatchEvent(new Event("suite:usage-changed")); suite.toast(x.status === "failed" ? "Build failed" : `Version ${x.number} is ready`); openProject(state.pid, state.version); } }, 1000);
    return;
  }
  if (v.status === "failed") { box.innerHTML = `<div class="panel"><div class="banner warn" style="margin:0"><b>This build failed.</b>&nbsp;${esc(suite.friendlyError(v.error))}</div><details style="margin-top:10px"><summary class="meta" style="cursor:pointer">Technical details</summary><pre class="meta" style="white-space:pre-wrap">${esc(v.error)}</pre></details></div>`; return; }
  const d = v.data;
  const blocking = v.issues.filter((i) => i.severity === "block").length;
  const tabs = [["requirements", `Requirements (${d.analysis.requirements.length})`], ["feasibility", "Product check"], ["scope", "Scope"], ["estimate", "Estimate"], ...(d.diff ? [["changes", `Changes (${d.diff.changes.filter((c) => c.change !== "unchanged").length})`]] : []), ["proposal", "Proposal"], ["approve", v.status === "approved" ? "Approved ✓" : `Review & approve${blocking ? ` (${blocking} to fix)` : ""}`]];
  if (!tabs.some(([k]) => k === state.tab)) state.tab = d.diff ? "changes" : "requirements";
  const e = d.estimate;
  box.innerHTML = `<div class="panel"><div class="row" style="margin:0"><h2 style="margin:0">Version ${v.number}</h2><span class="badge ${VSTATUS[v.status] ?? ""}">${esc(v.status)}</span><span class="spacer"></span><span class="meta">${esc(v.created_at)} · ${v.usage.calls ?? 0} model calls · $${(v.usage.cost_usd ?? 0).toFixed(3)}</span></div>
    <div class="cards" style="margin-top:14px">
      <div class="card"><b>${d.analysis.requirements.length}</b><span>requirements, each with a quote</span></div>
      <div class="card"><b>${d.feasibility.filter((f) => f.verdict !== "custom_development").length} / ${d.feasibility.length}</b><span>already in the product</span></div>
      <div class="card"><b>${e.expected_hours} h</b><span>expected effort (PERT)</span></div>
      <div class="card"><b>${esc(e.currency)} ${e.price_low.toLocaleString()}–${e.price_high.toLocaleString()}</b><span>price range, computed in code</span></div>
    </div>
    <div class="vtabs" role="tablist">${tabs.map(([k, label]) => `<button role="tab" data-tab="${k}" aria-selected="${k === state.tab}">${esc(label)}</button>`).join("")}</div><div id="tab" class="table-wrap"></div></div>`;
  box.querySelectorAll(".vtabs button").forEach((b) => b.onclick = () => { state.tab = b.dataset.tab; loadVersion(); });
  $("#tab").innerHTML = render[state.tab](v, d);
  if (state.tab === "approve") wireApprove(v);
}

const evidence = (ev) => ev.map((e) => `<div class="quote">“${esc(e.quote)}” <span>${esc(e.speaker)}${e.timestamp ? ` @ ${esc(e.timestamp)}` : ""} · ${esc(e.meeting_id)}${e.verified ? "" : ` · <span class="badge warn">quote not found in transcript</span>`}</span></div>`).join("");
const notes = (title, items) => items.length ? `<h3 class="label">${title}</h3>${items.map((n) => `<div style="margin-bottom:8px">${esc(n.statement)}${evidence(n.evidence)}</div>`).join("")}` : "";
const list = (title, items) => items.length ? `<h3 class="label">${title}</h3><ul>${items.map((i) => `<li>${esc(i)}</li>`).join("")}</ul>` : "";

const render = {
  requirements: (v, d) => `<table><thead><tr><th>ID</th><th>Requirement, and what the client said</th><th>Status</th><th>Priority</th></tr></thead><tbody>${d.analysis.requirements.map((r) => `<tr><td>${esc(r.id)}</td><td>${esc(r.description)}${r.origin === "inferred" ? ` <span class="badge">inferred</span>` : ""}${evidence(r.evidence)}</td><td><span class="badge ${RSTATUS[r.status] ?? ""}">${esc(r.status)}</span></td><td>${esc(r.priority)}</td></tr>`).join("")}</tbody></table>${notes("Decisions", d.analysis.decisions)}${notes("Constraints", d.analysis.constraints)}${notes("Open questions", d.analysis.open_questions)}${notes("Commitments", d.analysis.commitments)}`,
  feasibility: (v, d) => { const reqs = Object.fromEntries(d.analysis.requirements.map((r) => [r.id, r])); return `<p class="meta">Each requirement was checked against the product's help center through the Knowledge Brain. A built-in setting costs the client far less than custom code.</p><table><thead><tr><th>Requirement</th><th>Verdict</th><th>Details</th></tr></thead><tbody>${d.feasibility.map((f) => { const [label, kind] = VERDICT[f.verdict] || [f.verdict, ""]; return `<tr><td>${esc(f.requirement_id)} ${esc(reqs[f.requirement_id]?.description)}</td><td><span class="badge ${kind}">${esc(label)}</span></td><td>${esc(f.explanation)}${f.how_to ? `<div><b>How:</b> ${esc(f.how_to)}</div>` : ""}${f.limitation ? `<div><b>Limit:</b> ${esc(f.limitation)}</div>` : ""}${f.clarifying_question ? `<div><b>Ask:</b> ${esc(f.clarifying_question)}</div>` : ""}<div class="meta">${f.kb_sources.map((s) => s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>` : esc(s.title)).join(" · ") || `knowledge base: ${esc(f.kb_status)}`}</div></td></tr>`; }).join("")}</tbody></table>`; },
  scope: (v, d) => d.scope.deliverables.map((x) => `<h3 style="margin:16px 0 4px">${esc(x.id)} ${esc(x.title)} <span class="badge">${esc(x.approach)}</span></h3><div>${esc(x.description)}</div><div class="meta">Covers ${x.requirement_ids.map(esc).join(", ")}</div><ul>${x.acceptance_criteria.map((c) => `<li>${esc(c)}</li>`).join("")}</ul>`).join("") + list("Left out on purpose", d.scope.excluded.map((e) => `${e.requirement_id}: ${e.reason}`)) + list("Not included", d.scope.exclusions) + list("Assumptions", d.scope.assumptions) + list("Dependencies", d.scope.dependencies) + list("Client responsibilities", d.scope.client_responsibilities) + list("Open questions", d.scope.open_questions),
  estimate: (v, d) => { const e = d.estimate; return `<table><thead><tr><th>Deliverable</th><th>Task</th><th>Low</th><th>Likely</th><th>High</th><th>Confidence</th></tr></thead><tbody>${e.tasks.map((t) => `<tr><td>${esc(t.deliverable_id)}</td><td>${esc(t.name)}<div class="meta">${esc(t.assumptions)}</div></td><td>${t.low_hours}</td><td>${t.likely_hours}</td><td>${t.high_hours}</td><td><span class="badge ${t.confidence === "low" ? "warn" : ""}">${esc(t.confidence)}</span></td></tr>`).join("")}<tr><td></td><td><b>Total</b></td><td><b>${e.low_hours}</b></td><td><b>${e.likely_hours}</b></td><td><b>${e.high_hours}</b></td><td></td></tr></tbody></table><p><b>Expected ${e.expected_hours} h</b> (PERT). Price range <b>${esc(e.currency)} ${e.price_low.toLocaleString()} to ${e.price_high.toLocaleString()}</b> at ${esc(e.currency)} ${e.hourly_rate}/h with ${e.contingency_pct}% contingency. The model estimates task hours; all arithmetic is done in code.</p>${list("Risks", e.risks)}`; },
  changes: (v, d) => { const x = d.diff; const shown = x.changes.filter((c) => c.change !== "unchanged"); const flagged = shown.filter((c) => c.out_of_scope).length; return `<div class="cards"><div class="card"><b>${shown.length}</b><span>changes vs approved v${x.baseline_version}</span></div><div class="card"><b>${flagged}</b><span>add work: quote separately</span></div><div class="card"><b>${x.hours_delta_expected >= 0 ? "+" : ""}${x.hours_delta_expected} h</b><span>effect on expected effort</span></div></div><p class="meta">Compared with the approved version, not with the last draft. Changes that reduce work aren't flagged.</p><table><thead><tr><th>Change</th><th>Requirement</th><th>Before → after</th></tr></thead><tbody>${shown.map((c) => `<tr><td><span class="badge ${CHANGE[c.change] ?? ""}">${esc(c.change)}</span>${c.out_of_scope ? `<div style="margin-top:4px"><span class="badge warn">adds work</span></div>` : ""}</td><td>${esc(c.requirement_id)}<div>${esc(c.summary)}</div>${evidence(c.evidence)}</td><td>${c.before ? `<div class="meta">Before: ${esc(c.before)}</div>` : ""}${c.after ? `<div>After: ${esc(c.after)}</div>` : ""}</td></tr>`).join("") || `<tr><td colspan="3" class="meta">No requirement changes.</td></tr>`}</tbody></table>${list("Constraint changes", x.constraint_changes)}<p>Price effect: <b>${esc(d.estimate.currency)} ${x.price_delta_low.toLocaleString()} to ${x.price_delta_high.toLocaleString()}</b>. ${x.changes.filter((c) => c.change === "unchanged").length} requirement(s) unchanged.</p>`; },
  proposal: (v, d) => `<div class="doc">${markdown(d.proposal_md)}</div>`,
  approve: (v) => `${v.issues.length ? v.issues.map((i) => `<div class="issue ${i.severity}">${i.severity === "block" ? "Must fix" : "Check"}: ${esc(i.message)}</div>`).join("") : `<div class="banner ok">The automatic review found no issues.</div>`}
    ${v.status === "approved" ? `<div class="banner ok">Approved by <b>${esc(v.approved_by)}</b> at ${esc(v.approved_at)}${v.approval_note ? ` · note: ${esc(v.approval_note)}` : ""}</div><div class="row"><button class="btn" id="export">Download proposal for the client</button></div>`
      : v.status === "draft" ? `<h3 class="label">Approve</h3><p class="meta">Approving makes this the baseline later meetings are compared against, and unlocks the client proposal download. ${v.issues.some((i) => i.severity === "block") ? "There are blocking issues, so a note explaining your decision is required." : ""}</p><div class="row"><input id="a-name" placeholder="Your name" value="${esc(actor())}" style="max-width:220px"><input id="a-note" data-mic placeholder="Note${v.issues.some((i) => i.severity === "block") ? " (required)" : " (optional)"}" style="flex:1;min-width:200px"></div><div class="row"><button class="btn" id="approve">Approve version ${v.number}</button><button class="btn secondary" disabled title="Only an approved version can be exported">Download proposal (after approval)</button><span class="meta" id="a-msg"></span></div>`
      : `<p class="meta">This version is ${esc(v.status)} and can no longer be approved.</p>`}`,
};

function wireApprove(v) {
  const a = $("#approve");
  if (a) a.onclick = async () => {
    const name = $("#a-name").value.trim(); saveActor(name);
    try { await api(`/api/projects/${state.pid}/versions/${v.number}/approve`, { method: "POST", body: JSON.stringify({ actor: name, ...($("#a-note").value.trim() ? { note: $("#a-note").value.trim() } : {}) }) }); suite.toast(`Version ${v.number} approved`); openProject(state.pid, v.number); }
    catch (e) { $("#a-msg").textContent = e.message; }
  };
  const x = $("#export");
  if (x) x.onclick = async () => {
    try {
      const md = await api(`/api/projects/${state.pid}/versions/${v.number}/export?actor=${encodeURIComponent(actor())}`);
      const url = URL.createObjectURL(new Blob([md], { type: "text/markdown" }));
      const link = Object.assign(document.createElement("a"), { href: url, download: `proposal-v${v.number}.md` });
      link.click(); URL.revokeObjectURL(url);
    } catch (e) { banner(e.message); }
  };
}

function inline(s) {
  return esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\*(.+?)\*/g, "<i>$1</i>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function markdown(md) {
  const out = []; let lst = null, table = null;
  const flush = () => { if (lst) { out.push(`<ul>${lst.join("")}</ul>`); lst = null; } if (table) { out.push(`<table>${table.join("")}</table>`); table = null; } };
  for (const line of md.split("\n")) {
    if (/^\|/.test(line)) { if (/^\|[-| ]+\|$/.test(line)) continue; table ??= []; const cells = line.split("|").slice(1, -1).map((c) => `<td>${inline(c.trim())}</td>`); table.push(`<tr>${cells.join("")}</tr>`); continue; }
    if (/^- /.test(line)) { lst ??= []; lst.push(`<li>${line.startsWith("- [ ] ") ? "☐ " + inline(line.slice(6)) : inline(line.slice(2))}</li>`); continue; }
    flush();
    const h = line.match(/^(#{1,3}) (.*)$/);
    if (h) out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`);
    else if (line.startsWith("> ")) out.push(`<blockquote>${inline(line.slice(2))}</blockquote>`);
    else if (line.trim()) out.push(`<p>${inline(line)}</p>`);
  }
  flush();
  return out.join("");
}

(async () => {
  const h = await api("/health").catch(() => null);
  state.building = Boolean(h?.building_enabled);
  $("#s-right").innerHTML = h ? `<span class="badge ${state.building ? "ok" : "warn"}">${state.building ? "Building on" : "Building off"}</span>` : "";
  if (h && !state.building) banner("Building is off until Claude on Amazon Bedrock is configured (AWS_REGION and AWS credentials). You can still create projects, add transcripts and review versions.", "info");
  samples = await api("/api/samples").catch(() => []);
  const ps = await loadProjects();
  const built = ps.find((p) => p.latest_version);
  if (built) openProject(built.id); else welcome(ps);
})();
</script>
