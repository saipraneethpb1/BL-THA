[project]
name = "knowledge-brain"
version = "0.1.0"
description = "Knowledge Brain: help-center RAG service (Task 1)"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "anthropic>=1.15.0",
    "av>=14,<16",
    "fastapi>=0.143.3",
    "fastembed>=0.9.0",
    "faster-whisper>=1.1",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "selectolax>=1.0.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]  # the formatter handles code width; long SQL strings are clearer unwrapped

[tool.mypy]
strict = true
python_version = "3.12"
packages = ["kb"]

[[tool.mypy.overrides]]
module = ["faster_whisper", "faster_whisper.*"]  # ships no type hints
ignore_missing_imports = true
